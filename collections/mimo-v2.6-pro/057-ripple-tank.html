<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ripple Tank</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0c1a22;color:#bfe6e2;font-family:ui-monospace,Menlo,Consolas,monospace;
  display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 14px}
h1{font-size:14px;letter-spacing:.4em;font-weight:500;color:#5fe0d0;text-transform:uppercase}
#tank{position:relative;border:1px solid #1d3a45;border-radius:10px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6);cursor:grab}
#tank:active{cursor:grabbing}
canvas{display:block}
#hint{position:absolute;left:10px;top:8px;font-size:10px;letter-spacing:.16em;color:rgba(180,235,230,.7);pointer-events:none}
#panel{display:flex;gap:20px;align-items:center;background:#0f232c;border:1px solid #1d3a45;border-radius:10px;padding:12px 18px;flex-wrap:wrap;justify-content:center}
.row{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.14em;color:#6fa39e}
input[type=range]{width:110px;accent-color:#5fe0d0}
.row span{color:#5fe0d0;min-width:52px;text-align:right}
button{background:#123039;border:1px solid #2c5b66;color:#5fe0d0;font:10px ui-monospace,monospace;letter-spacing:.14em;padding:7px 13px;border-radius:6px;cursor:pointer}
button:hover{background:#1a4551}
button.on{background:#5fe0d0;color:#08161c}
</style>
</head>
<body>
<h1>Ripple Tank — two-source interference</h1>
<div id="tank">
  <canvas id="cv" width="720" height="400"></canvas>
  <div id="hint">drag the emitters</div>
</div>
<div id="panel">
  <div class="row"><label>WAVELENGTH</label><input id="lam" type="range" min="18" max="90" value="42"><span id="lamV">42px</span></div>
  <div class="row"><label>SPEED</label><input id="spd" type="range" min="0" max="200" value="90"><span id="spdV">0.90×</span></div>
  <div class="row"><label>SOURCES</label><input id="cnt" type="range" min="1" max="4" value="2"><span id="cntV">2</span></div>
  <button id="mode">show nodal lines</button>
  <button id="pause">freeze</button>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var LW=360,LH=200; // compute at half res
var off=document.createElement("canvas");off.width=LW;off.height=LH;
var octx=off.getContext("2d");
var img=octx.createImageData(LW,LH);
var lam=42,speed=.9,mode=0,paused=false;
var S=[{x:170,y:100,ph:0},{x:300,y:120,ph:Math.PI},{x:240,y:60,ph:1.6},{x:120,y:150,ph:3.1}];
var nSrc=2,t=0;
function field(x,y){
  var s=0;
  for(var i=0;i<nSrc;i++){
    var src=S[i];
    var dx=x-src.x,dy=y-src.y;
    var r=Math.sqrt(dx*dx+dy*dy)+1;
    s+=Math.sin((2*Math.PI*r)/lam - t*4 + src.ph)/Math.sqrt(r*0.35);
  }
  return s;
}
function render(){
  var d=img.data;
  var k=2*Math.PI/lam;
  var idx=0;
  for(var y=0;y<LH;y++){
    for(var x=0;x<LW;x++){
      var v=0;
      for(var i=0;i<nSrc;i++){
        var src=S[i],dx=x-src.x,dy=y-src.y;
        var r=Math.sqrt(dx*dx+dy*dy)+1;
        v+=Math.sin(k*r - t*4 + src.ph)/Math.sqrt(r*0.35);
      }
      if(mode){ // time-averaged intensity -> nodal lines
        var a=0;
        for(var p=0;p<nSrc;p++){
          for(var q=p+1;q<nSrc;q++){
            var ax=x-S[p].x,ay=y-S[p].y,bx=x-S[q].x,by=y-S[q].y;
            var rp=Math.sqrt(ax*ax+ay*ay)+1,rq=Math.sqrt(bx*bx+by*by)+1;
            a=Math.max(a,Math.abs((k*(rp-rq))%Math.PI));
          }
        }
        v=a*(v>0?.6:.6);
        d[idx]=Math.round(10+v*30);
        d[idx+1]=Math.round(40+v*170);
        d[idx+2]=Math.round(52+v*150);
      }else{
        var c=(v+1.6)/3.2; // 0..1
        if(c<0)c=0;if(c>1)c=1;
        var crest=Math.pow(c,3);
        d[idx]=Math.round(8+crest*160);
        d[idx+1]=Math.round(30+crest*225);
        d[idx+2]=Math.round(44+crest*205);
      }
      d[idx+3]=255;
      idx+=4;
    }
  }
  octx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(off,0,0,cv.width,cv.height);
  // emitters
  for(var i2=0;i2<nSrc;i2++){
    var s=S[i2],px=s.x*2,py=s.y*2;
    ctx.beginPath();ctx.arc(px,py,7,0,6.283);
    ctx.fillStyle="#ffe98a";ctx.shadowColor="#ffe98a";ctx.shadowBlur=16;ctx.fill();ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(px,py,14,0,6.283);
    ctx.strokeStyle="rgba(255,233,138,.5)";ctx.lineWidth=1.5;ctx.stroke();
  }
}
function loop(){
  if(!paused)t+=speed*0.016;
  render();
  requestAnimationFrame(loop);
}
var dragging=-1;
function toLocal(e){
  var r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(LW/r.width),y:(e.clientY-r.top)*(LH/r.height)};
}
cv.addEventListener("pointerdown",function(e){
  var p=toLocal(e),best=-1,bd=1e9;
  for(var i=0;i<nSrc;i++){
    var dx=p.x-S[i].x,dy=p.y-S[i].y,d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=i;}
  }
  if(bd<900){dragging=best;cv.setPointerCapture(e.pointerId);}
});
cv.addEventListener("pointermove",function(e){
  if(dragging<0)return;
  var p=toLocal(e);
  S[dragging].x=Math.max(12,Math.min(LW-12,p.x));
  S[dragging].y=Math.max(12,Math.min(LH-12,p.y));
});
cv.addEventListener("pointerup",function(){dragging=-1;});
document.getElementById("lam").addEventListener("input",function(){lam=+this.value;document.getElementById("lamV").textContent=lam+"px";});
document.getElementById("spd").addEventListener("input",function(){speed=+this.value/100;document.getElementById("spdV").textContent=speed.toFixed(2)+"×";});
document.getElementById("cnt").addEventListener("input",function(){nSrc=+this.value;document.getElementById("cntV").textContent=nSrc;});
document.getElementById("mode").addEventListener("click",function(){
  mode=mode?0:1;
  this.textContent=mode?"show live ripples":"show nodal lines";
  this.classList.toggle("on");
});
document.getElementById("pause").addEventListener("click",function(){
  paused=!paused;this.textContent=paused?"resume":"freeze";this.classList.toggle("on");
});
loop();
})();
</script>
</body>
</html>
