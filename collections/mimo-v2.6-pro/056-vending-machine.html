<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vending Machine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#23262b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  font-family:ui-monospace,Menlo,Consolas,monospace;color:#c9cfd6;padding:26px 14px;
  background-image:radial-gradient(circle at 50% 20%,rgba(255,255,255,.06),transparent 60%)}
#machine{width:400px;background:linear-gradient(160deg,#8d2b33,#6d1f27 60%,#571820);border-radius:18px;padding:18px;
  border:3px solid #3d1216;box-shadow:0 30px 70px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.14)}
#brand{font-size:12px;letter-spacing:.4em;color:#ffd9a8;text-align:center;margin-bottom:12px}
#body2{display:flex;gap:12px}
#glass{flex:1;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:2px solid #2c2f34;border-radius:10px;
  padding:8px;position:relative;overflow:hidden}
.rowitem{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dashed rgba(255,255,255,.12);position:relative}
.rowitem:last-child{border-bottom:none}
.cell{width:56px;height:38px;position:relative;overflow:hidden;border-radius:4px;background:rgba(0,0,0,.28)}
.coil{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#9aa3ab 0 3px,transparent 3px 11px);opacity:.75;border-radius:4px}
.prod{position:absolute;left:50%;top:50%;width:26px;height:26px;border-radius:50%;transform:translate(-50%,-50%);
  box-shadow:inset -4px -5px 0 rgba(0,0,0,.28),0 2px 4px rgba(0,0,0,.4);transition:filter .2s}
.rowitem.out .prod{filter:grayscale(1) brightness(.5)}
.info{flex:1;font-size:10px;line-height:1.5}
.info b{color:#ffe6c2;font-weight:600;letter-spacing:.1em}
.info span{color:#f0a9b2}
.pick{width:34px;height:34px;border-radius:50%;border:2px solid #ffd9a8;background:#3d1216;color:#ffd9a8;font:12px ui-monospace,monospace;cursor:pointer}
.pick:hover{background:#ffd9a8;color:#3d1216}
.pick:disabled{opacity:.35;cursor:default}
#side{width:120px;display:flex;flex-direction:column;gap:10px}
#creditBox{background:#17191d;border:2px solid #2c2f34;border-radius:8px;padding:9px;text-align:center}
#creditBox small{font-size:9px;letter-spacing:.2em;color:#7f8892}
#credit{font-size:22px;color:#7fe3a5;margin-top:3px}
.coins{display:flex;gap:6px}
.coin{flex:1;background:#2f343b;border:1px solid #474e57;color:#ffd9a8;font:11px ui-monospace,monospace;padding:7px 0;border-radius:6px;cursor:pointer}
.coin:hover{background:#3d444d}
#returnB{background:#3d1216;border:1px solid #ffd9a8;color:#ffd9a8;font:11px ui-monospace,monospace;padding:7px 0;border-radius:6px;cursor:pointer;letter-spacing:.1em}
#returnB:hover{background:#ffd9a8;color:#3d1216}
#chuteWrap{margin-top:14px;background:#2c0f13;border:2px solid #3d1216;border-radius:10px;height:78px;position:relative;overflow:hidden}
#chuteFlap{position:absolute;top:0;left:0;right:0;height:14px;background:linear-gradient(#4a171d,#381216);transition:transform .18s}
#chuteFlap.lift{transform:translateY(-10px)}
#chuteLabel{position:absolute;bottom:6px;width:100%;text-align:center;font-size:9px;letter-spacing:.3em;color:#c08a92}
#status{font-size:11px;letter-spacing:.14em;color:#8d97a2;min-height:16px;text-transform:uppercase}
#dropped{position:absolute;left:50%;top:-40px;width:30px;height:30px;border-radius:50%;transform:translateX(-50%);
  box-shadow:inset -5px -6px 0 rgba(0,0,0,.3);opacity:0}
#dropped.drop{animation:fall .7s cubic-bezier(.5,.05,.7,1) forwards}
@keyframes fall{0%{opacity:1;top:-40px}70%{opacity:1;top:52px}85%{top:44px}100%{opacity:1;top:52px}}
.vend .coil{animation:spin .5s linear 2}
@keyframes spin{to{background-position:-11px 0}}
</style>
</head>
<body>
<h1 style="font-size:14px;letter-spacing:.36em;color:#ffd9a8;font-weight:500">SNACKO MATIC 2000</h1>
<div id="machine">
  <div id="brand">• FRESH • COLD • HONEST •</div>
  <div id="body2">
    <div id="glass"></div>
    <div id="side">
      <div id="creditBox"><small>CREDIT</small><div id="credit">$0.00</div></div>
      <div class="coins">
        <button class="coin" data-c="1">$1</button><button class="coin" data-c="2">$2</button><button class="coin" data-c="5">$5</button>
      </div>
      <button id="returnB">return coin</button>
      <div style="font-size:9px;color:#e7b0b6;line-height:1.6;text-align:center">insert money ·<br>press a letter ·<br>collect below</div>
    </div>
  </div>
  <div id="chuteWrap"><div id="dropped"></div><div id="chuteFlap"></div><div id="chuteLabel">DELIVERY CHUTE</div></div>
</div>
<div id="status">insert coin to begin</div>
<script>
(function(){
"use strict";
var ITEMS=[
 {k:"A1",n:"CHERRY POP",p:1.50,c:"#e0455a"},
 {k:"A2",n:"COLA CLASSIC",p:1.75,c:"#c2452f"},
 {k:"A3",n:"LIME SODA",p:1.75,c:"#5fbf58"},
 {k:"B1",n:"ORANGE CRUSH",p:1.75,c:"#eb9335"},
 {k:"B2",n:"GRAPE JUICE",p:2.00,c:"#8a4bbf"},
 {k:"B3",n:"WATER SPRING",p:1.25,c:"#5aa8d8"},
 {k:"C1",n:"LEMON TEA",p:2.00,c:"#e6c94a"},
 {k:"C2",n:"BLACK COFFEE",p:2.25,c:"#7a5236"},
 {k:"C3",n:"ENERGY TONIC",p:2.50,c:"#d84a9b"}
];
var glass=document.getElementById("glass");
var credit=0,status=document.getElementById("status"),creditEl=document.getElementById("credit");
var dropped=document.getElementById("dropped"),flap=document.getElementById("chuteFlap");
ITEMS.forEach(function(it,i){
  var row=document.createElement("div");
  row.className="rowitem";row.id="row"+i;
  row.innerHTML='<div class="cell"><div class="coil"></div><div class="prod" style="background:'+it.c+'"></div></div>'+
    '<div class="info"><b>'+it.k+" "+it.n+'</b><br>$'+it.p.toFixed(2)+'</div>'+
    '<button class="pick" data-i="'+i+'">'+it.k+"</button>";
  glass.appendChild(row);
});
function paint(){
  creditEl.textContent="$"+credit.toFixed(2);
  var picks=glass.querySelectorAll(".pick");
  for(var i=0;i<picks.length;i++){
    picks[i].disabled=!(credit>=ITEMS[i].p);
  }
}
glass.addEventListener("click",function(e){
  var b=e.target;if(!b.classList.contains("pick"))return;
  var it=ITEMS[+b.dataset.i];
  if(credit<it.p){status.textContent="not enough credit for "+it.n;return;}
  credit=Math.round((credit-it.p)*100)/100;
  status.textContent=it.k+" vend — coil winding";
  paint();
  var row=document.getElementById("row"+b.dataset.i);
  row.classList.add("vend");
  dropped.style.background=it.c;
  dropped.classList.remove("drop");void dropped.offsetWidth;
  dropped.classList.add("drop");
  flap.classList.add("lift");
  setTimeout(function(){flap.classList.remove("lift");},700);
  setTimeout(function(){row.classList.remove("vend");status.textContent=it.n+" is in the chute";},1000);
});
var coinBtns=document.querySelectorAll(".coin");
for(var c=0;c<coinBtns.length;c++){
  coinBtns[c].addEventListener("click",function(){
    credit+=+this.dataset.c;
    status.textContent="credit accepted";
    paint();
  });
}
document.getElementById("returnB").addEventListener("click",function(){
  if(credit<=0){status.textContent="no credit to return";return;}
  status.textContent="$"+credit.toFixed(2)+" returned — remember your change";
  credit=0;paint();
});
paint();
})();
</script>
</body>
</html>
