<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>023 · Deckhand Terminal</title>
<style>
:root{--bg:#0a0e0a;--fg:#b8f5c4;--dim:#4e7a58;--line:#17251a;--amber:#ffcf6b;
  --hot:#ff6b6b;--cyan:#6be0ff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  font-size:14.5px;line-height:1.55;
  text-shadow:0 0 6px rgba(120,255,160,.25)}
#scan{position:fixed;inset:0;pointer-events:none;z-index:9;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px);
  mix-blend-mode:multiply}
#glow{position:fixed;inset:0;pointer-events:none;z-index:8;
  background:radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.65))}
.wrap{display:flex;flex-direction:column;height:100%;padding:14px 16px 10px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:center;
  border-bottom:1px solid var(--line);padding-bottom:9px;flex-wrap:wrap}
.top .id{color:var(--dim);letter-spacing:.22em;text-transform:uppercase;font-size:11px}
.top .id b{color:var(--fg);font-weight:400}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);color:var(--dim);padding:3px 9px;font-size:10.5px;
  letter-spacing:.16em;text-transform:uppercase}
.chip b{color:var(--amber);font-weight:400}
.chip.live b{color:var(--hot);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

#out{flex:1;overflow-y:auto;padding:12px 2px 6px;scrollbar-width:thin;
  scrollbar-color:var(--line) transparent}
#out div{white-space:pre-wrap;word-break:break-word;margin:0 0 1px}
.m{color:var(--dim)}
.k{color:var(--cyan)}
.w{color:var(--amber)}
.e{color:var(--hot);text-shadow:0 0 6px rgba(255,107,107,.35)}
.g{color:var(--fg)}
.dim{color:#37523e}
.bar{color:var(--dim)}
.bar b{color:var(--fg);font-weight:400}
.caret{display:inline-block;width:9px;height:16px;background:var(--fg);
  vertical-align:-3px;animation:caret 1s steps(2) infinite}
@keyframes caret{50%{opacity:0}}

form{display:flex;align-items:center;gap:9px;border-top:1px solid var(--line);
  padding-top:10px;margin-top:2px}
.prompt{color:var(--amber);white-space:nowrap}
input{flex:1;background:transparent;border:0;outline:none;color:var(--fg);
  font:inherit;caret-color:var(--fg);text-shadow:inherit}
::placeholder{color:#37523e}
.hint{color:#37523e;font-size:11px;letter-spacing:.1em}
.help{color:var(--dim);font-size:12px;padding:6px 2px 0;letter-spacing:.04em}
.help b{color:var(--cyan);font-weight:400}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important}
  #out div{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div id="scan"></div><div id="glow"></div>

<div class="wrap">
  <div class="top">
    <span class="id">deckhand <b>v3.1</b> · tty/0 · sector <b>kepler-442</b></span>
    <span class="chips">
      <span class="chip live">link <b>live</b></span>
      <span class="chip">power <b id="cPw">97%</b></span>
      <span class="chip">cargo <b id="cCg">12</b></span>
      <span class="chip">clock <b id="cT">00:00:00</b></span>
    </span>
  </div>

  <div id="out" role="log" aria-live="polite" aria-label="terminal output"></div>

  <div class="help">type <b>help</b> for commands · <b>scan</b> · <b>manifest</b> ·
    <b>plot</b> · <b>fly</b> · <b>clear</b> · history with ↑ / ↓</div>

  <form id="frm" autocomplete="off">
    <span class="prompt">deckhand@kepler:~$</span>
    <input id="cmd" type="text" placeholder="enter command…" aria-label="command input"
      spellcheck="false" maxlength="80">
    <span class="hint">↵ run</span>
  </form>
</div>

<script>
(function(){
  "use strict";
  var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var out=document.getElementById("out"), frm=document.getElementById("frm");
  var input=document.getElementById("cmd");
  var hist=[], hi=-1, power=97, cargo=12, busy=false;

  function line(html,cls,delay){
    var d=document.createElement("div");
    if(cls) d.className=cls;
    d.innerHTML=html;
    out.appendChild(d);
    out.scrollTop=out.scrollHeight;
    if(!reduce){
      d.style.opacity="0";
      d.style.transform="translateY(6px)";
      d.style.transition="opacity .25s ease, transform .25s ease";
      setTimeout(function(){ d.style.opacity="1"; d.style.transform="none"; },
        delay!==undefined?delay:20);
    }
    return d;
  }

  function typeInto(node,html,cb){
    if(reduce){ node.innerHTML=html; if(cb) cb(); return; }
    var i=0;
    (function tick(){
      /* reveal by plain text length so markup appears whole */
      node.textContent=html.slice(0,i);
      i+=2;
      out.scrollTop=out.scrollHeight;
      if(i<=html.length+1) setTimeout(tick,6);
      else{ node.innerHTML=html; if(cb) cb(); }
    })();
  }

  function banner(){
    var art=[
      "  ____                      __        _____          _   ",
      " |  _ \\ _ __ ___  __ _ _ __| |_ ___  |  ___|__  __ _| | ",
      " | | | | '__/ _ \\/ _` | '__| __/ _ \\ | |_ / _ \\/ _` | | ",
      " | |_| | | |  __/ (_| | |  | ||  __/ |  _|  __/ (_| | | ",
      " |____/|_|  \\___|\\__,_|_|   \\__\\___| |_|   \\___|\\__,_|_| "
    ];
    var el=line("", "dim");
    var idx=0;
    (function next(){
      if(idx<art.length){
        el.textContent += art[idx++]+"\n";
        setTimeout(next, reduce?0:60);
      }else{
        line("<span class='m'>Deckhand flight console · sector relay established.</span>");
        line("<span class='m'>Type </span><span class='k'>help</span><span class='m'> to list available commands.</span>");
        line("&nbsp;");
      }
    })();
  }

  function bar(pct,w){
    var n=Math.round(pct/100*w);
    return "["+"█".repeat(n)+"░".repeat(w-n)+"]";
  }

  var commands={
    help:function(){
      line("<span class='k'>available commands</span>");
      [["help","this list"],["status","power, cargo, route"],
       ["scan","sweep the sector for contacts"],
       ["manifest","list cargo bays"],
       ["plot","draw the current route as ASCII"],
       ["fly","execute the plotted burn"],
       ["power [n]","set reactor output to n%"],
       ["say [text]","open a channel to the bridge"],
       ["clear","wipe the buffer"],["date","ship's clock"]
      ].forEach(function(c){
        line("  <span class='w'>"+c[0].padEnd(14)+"</span><span class='m'>"+c[1]+"</span>");
      });
      line("&nbsp;");
    },
    status:function(){
      line("<span class='k'>— vessel status —</span>");
      line("  reactor  <b class='g'>"+bar(power,26)+"</b> "+power+"%");
      line("  cargo    <b class='g'>"+bar(Math.min(100,cargo*8),26)+"</b> "+cargo+" bays");
      line("  integrity <span class='g'>nominal</span> · comms <span class='g'>locked</span>");
      line("&nbsp;");
    },
    scan:function(){
      busy=true;
      var el=line("<span class='m'>scanning sector</span> <span class='dim'>…</span>");
      var dots=0;
      var t=setInterval(function(){
        dots=(dots+1)%4;
        el.innerHTML="<span class='m'>scanning sector</span> <span class='dim'>"+
          ".".repeat(dots)+"&nbsp;".repeat(3-dots)+"</span>";
      }, reduce?1:220);
      setTimeout(function(){
        clearInterval(t);
        var n=2+Math.floor(Math.random()*5);
        el.innerHTML="<span class='k'>scan complete — "+n+" contacts</span>";
        for(var i=0;i<n;i++){
          var kind=["drift rock","relay buoy","trade lugger","ice cluster"][Math.floor(Math.random()*4)];
          var dist=(Math.random()*9+1).toFixed(2);
          var ang=Math.floor(Math.random()*360);
          setTimeout(function(k,d,a){
            line("  <span class='dim'>›</span> "+k.padEnd(14)+
              " <span class='w'>"+String(a).padStart(3,"0")+"°</span> "+
              "<span class='g'>"+d+" AU</span>");
          }, kind,dist,ang);
        }
        line("&nbsp;");
        busy=false;
      }, reduce?60:1500);
    },
    manifest:function(){
      var items=[["hydroponic trays",4],["reactor cones",3],["archive spools",2],
                 ["medical foam",1],["trade spice",2]];
      line("<span class='k'>— cargo manifest —</span>");
      items.forEach(function(it,i){
        var id=String(i+1).padStart(2,"0");
        line("  <span class='dim'>bay "+id+"</span>  "+it[0].padEnd(20)+" <span class='w'>×"+
          String(it[1]).padStart(2," ")+"</span>");
      });
      line("  <span class='dim'>——————————————</span>  <span class='m'>total</span> <span class='w'>12</span>");
      line("&nbsp;");
    },
    plot:function(){
      var rows=[
        "        ·  .  *        .",
        "   *        [RELAY-7]        .",
        "        .        \\",
        "  [KEPLER-442]     \\  3.2 AU burn",
        "        \\           \\",
        "         ···········▶[DOCK-YARD]",
        "      .        *          ."
      ];
      line("<span class='k'>— route plot —</span>");
      rows.forEach(function(r,i){
        line("<span class='"+(i===4?"w":"dim")+"'>"+r.replace(/</g,"&lt;")+"</span>");
      });
      line("<span class='m'>burn window opens in </span><span class='g'>00:14:22</span>");
      line("&nbsp;");
    },
    fly:function(){
      if(power<40){ line("<span class='e'>insufficient reactor output for a clean burn (need ≥ 40%).</span>"); return; }
      busy=true;
      var el=line("<span class='m'>ignition</span> <span class='dim'>…</span>");
      var seq=["ignition …","thrust 30% …","thrust 100% …","coasting …","vessel moored at DOCK-YARD."];
      var i=0;
      var t=setInterval(function(){
        i++;
        if(i>=seq.length){
          clearInterval(t);
          el.innerHTML="<span class='g'>✓ "+seq[seq.length-1]+"</span>";
          line("<span class='w'>journey complete — cargo handover accepted.</span>");
          line("&nbsp;");
          busy=false;
          return;
        }
        el.innerHTML="<span class='m'>"+seq[i-1]+"</span> <span class='dim'>…</span>";
      }, reduce?1:520);
    },
    power:function(a){
      var n=parseInt(a,10);
      if(isNaN(n)||n<10||n>100){
        line("<span class='e'>usage: power [10-100]</span>"); return;
      }
      power=n;
      document.getElementById("cPw").textContent=power+"%";
      line("<span class='k'>reactor output set to "+power+"%</span> "+bar(power,20));
    },
    say:function(a){
      if(!a){ line("<span class='e'>usage: say [text]</span>"); return; }
      line("<span class='m'>tx ▸ bridge:</span> <span class='g'>"+a.replace(/[<>]/g,"")+"</span>");
      setTimeout(function(){
        line("<span class='m'>rx ◂ bridge:</span> <span class='w'>Copy that. Logged.</span>");
      }, reduce?10:700);
    },
    date:function(){
      line("<span class='m'>ship clock: </span><span class='g'>"+new Date().toString()+"</span>");
    },
    clear:function(){ out.innerHTML=""; },
    whoami:function(){ line("<span class='m'>operator-7 · clearance </span><span class='k'>GOLD</span>"); }
  };

  function run(raw){
    var txt=raw.trim();
    line("<span class='prompt'>deckhand@kepler:~$</span> <span class='g'>"+
      txt.replace(/[<>]/g,"")+"</span>");
    if(!txt) return;
    hist.unshift(txt); hi=-1;
    var parts=txt.split(/\s+/);
    var name=parts[0].toLowerCase();
    var fn=commands[name];
    if(!fn){
      line("<span class='e'>command not found: "+name.replace(/[<>]/g,"")+
        "</span> <span class='dim'>— try 'help'</span>");
      return;
    }
    fn(parts.slice(1).join(" "));
  }

  frm.addEventListener("submit",function(e){
    e.preventDefault();
    if(busy) return;
    var v=input.value;
    input.value="";
    run(v);
  });

  input.addEventListener("keydown",function(e){
    if(e.key==="ArrowUp"){
      e.preventDefault();
      if(hist.length){ hi=Math.min(hi+1,hist.length-1); input.value=hist[hi]; }
    }else if(e.key==="ArrowDown"){
      e.preventDefault();
      if(hi>0){ hi--; input.value=hist[hi]; } else { hi=-1; input.value=""; }
    }else if(e.key==="l" && e.ctrlKey){
      e.preventDefault(); commands.clear();
    }
  });

  document.addEventListener("click",function(){ input.focus(); });

  /* live clock + slow power drift */
  function clock(){
    var d=new Date();
    var p=function(n){ return String(n).padStart(2,"0"); };
    document.getElementById("cT").textContent=p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
  }
  clock(); setInterval(clock,1000);
  setInterval(function(){
    if(power>12 && Math.random()<0.4){
      power-=1;
      document.getElementById("cPw").textContent=power+"%";
    }
  },7000);

  banner();
  input.focus();
})();
</script>
</body>
</html>
