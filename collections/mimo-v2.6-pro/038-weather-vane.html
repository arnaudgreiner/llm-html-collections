<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>038 · Weather Vane</title>
<style>
:root{--bg:#0e1418;--panel:#141c21;--line:#26343b;--ink:#e4ecef;--mute:#8ba0a9;
  --acc:#ffb648;--cool:#79c6e6}
*{box-sizing:border-box}
body{margin:0;background:
  linear-gradient(180deg,#0b1116 0%,#101a20 55%,#16222a 100%);
  color:var(--ink);min-height:100vh;font-family:"Segoe UI",system-ui,Helvetica,Arial,sans-serif;
  padding-bottom:44px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:20px 28px 13px;
  border-bottom:1px solid var(--line)}
.kicker{font-size:9.5px;letter-spacing:.4em;text-transform:uppercase;color:var(--mute)}
h1{margin:0;font-size:26px;font-weight:300}
h1 b{font-weight:700;color:var(--acc)}
.meta{margin-left:auto;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.meta b{color:var(--acc);font-variant-numeric:tabular-nums}

.stage{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;padding:20px 28px 0}
@media(max-width:920px){.stage{grid-template-columns:1fr}}
.rig{display:flex;flex-direction:column;gap:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}
.card h2{margin:0 0 11px;font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--mute)}
.slab{display:flex;align-items:center;gap:9px;margin-bottom:11px;font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.slab input{flex:1;accent-color:var(--acc)}
.slab b{color:var(--ink);width:44px;text-align:right;font-variant-numeric:tabular-nums}
.compass2{display:flex;gap:9px}
.cardBtn{flex:1;font:inherit;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  font-weight:700;padding:10px 6px;border-radius:8px;border:1px solid var(--line);
  background:#1b262c;color:var(--ink);cursor:pointer;transition:.16s}
.cardBtn:hover{transform:translateY(-2px);border-color:var(--acc);color:var(--acc)}
.cardBtn.on{background:var(--acc);border-color:var(--acc);color:#0e1418}
.readings{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rd{background:#1b262c;border:1px solid var(--line);border-radius:9px;padding:9px 10px}
.rd span{display:block;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.rd b{font-size:17px;font-variant-numeric:tabular-nums;color:var(--acc)}
.rd small{font-size:10px;color:var(--mute)}
.stick{list-style:none;margin:0;padding:0;font-size:12px}
.stick li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dotted var(--line);
  letter-spacing:.06em}
.stick b{font-variant-numeric:tabular-nums;color:var(--cool)}
.rose{width:100%;max-width:250px;margin:4px auto 0;display:block}
.rose text{font-family:"Segoe UI",sans-serif}

.ground{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,#17242c,#101a20 70%);min-height:520px}
#field{display:block;width:100%;height:auto}
.flag{position:absolute;top:14px;right:16px;padding:7px 11px;border-radius:7px;
  background:rgba(14,20,24,.8);border:1px solid var(--acc);color:var(--acc);
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;pointer-events:none}
.legend{position:absolute;left:16px;bottom:14px;display:flex;gap:16px;flex-wrap:wrap;
  font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);pointer-events:none}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:19px 28px 0;
  font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <span class="kicker">quarry hill station</span>
  <h1>Weather <b>Vane</b></h1>
  <span class="meta">bearing <b id="hdg">000°</b> · gust <b id="gustHd">0</b> kt</span>
</header>

<div class="stage">
  <aside class="rig">
    <section class="card">
      <h2>Standing wind</h2>
      <label class="slab">direction <input id="dirIn" type="range" min="0" max="359" value="248"><b id="dirOut">248°</b></label>
      <label class="slab">speed kt <input id="spdIn" type="range" min="0" max="46" value="17"><b id="spdOut">17</b></label>
      <label class="slab">gustiness <input id="gstIn" type="range" min="0" max="100" value="45"><b id="gstOut">45</b></label>
      <div class="compass2" style="margin-top:4px">
        <button class="cardBtn" id="drift" type="button">veer slowly</button>
        <button class="cardBtn on" id="calm" type="button">live gusts</button>
      </div>
    </section>

    <section class="card">
      <h2>Rose</h2>
      <svg class="rose" viewBox="0 0 200 200" role="img" aria-label="compass rose">
        <circle cx="100" cy="100" r="86" fill="#101a20" stroke="#26343b"></circle>
        <circle cx="100" cy="100" r="64" fill="none" stroke="#26343b" stroke-dasharray="3 6"></circle>
        <g stroke="#3b5260" stroke-width="1">
          <line x1="100" y1="14" x2="100" y2="26"></line>
          <line x1="100" y1="174" x2="100" y2="186"></line>
          <line x1="14" y1="100" x2="26" y2="100"></line>
          <line x1="174" y1="100" x2="186" y2="100"></line>
        </g>
        <g font-size="11" fill="#8ba0a9" text-anchor="middle">
          <text x="100" y="36">N</text><text x="100" y="172">S</text>
          <text x="34" y="104">W</text><text x="168" y="104">E</text>
        </g>
        <g id="roseNeedle">
          <polygon points="100,26 106,100 100,112 94,100" fill="#ffb648"></polygon>
          <polygon points="100,174 106,100 100,88 94,100" fill="#3b5260"></polygon>
        </g>
        <circle cx="100" cy="100" r="7" fill="#0e1418" stroke="#ffb648"></circle>
        <g id="roseGust">
          <line x1="100" y1="100" x2="100" y2="22" stroke="#79c6e6" stroke-width="3" stroke-linecap="round"></line>
        </g>
      </svg>
      <div class="readings" style="margin-top:12px">
        <div class="rd"><span>mean</span><b id="rdMean">17</b> <small>kt</small></div>
        <div class="rd"><span>gust</span><b id="rdGust">24</b> <small>kt</small></div>
        <div class="rd"><span>cardinal</span><b id="rdCard" style="font-size:14px">WSW</b></div>
        <div class="rd"><span>beaufort</span><b id="rdBeau" style="font-size:14px">F5</b></div>
      </div>
    </section>

    <section class="card">
      <h2>Last hour</h2>
      <ul class="stick" id="stick"></ul>
    </section>
  </aside>

  <main class="ground">
    <canvas id="field" width="780" height="540"></canvas>
    <div class="flag" id="flag">WSW 17 kt</div>
    <div class="legend">
      <span><i style="background:#79c6e6"></i>streamlines</span>
      <span><i style="background:#ffb648"></i>vane &amp; gusts</span>
      <span>drag the field to steer</span>
    </div>
  </main>
</div>

<footer class="foot"><span>flow field · curl-noise streamers · mouse steers the standing wind</span><span>038 / 100</span></footer>

<script>
(function(){
  "use strict";
  var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv=document.getElementById("field"), ctx=cv.getContext("2d");
  var W=cv.width, H=cv.height;
  var G=function(id){return document.getElementById(id);};

  var wind={dir:248, spd:17, gust:0.45, veering:false, live:true};
  var particles=[];
  var PCOUNT=reduce?260:520;

  function initParticles(){
    particles=[];
    for(var i=0;i<PCOUNT;i++){
      particles.push({x:Math.random()*W, y:Math.random()*H,
        age:Math.random()*90, life:60+Math.random()*70,
        hue:Math.random()});
    }
  }
  initParticles();

  /* smooth pseudo-noise for direction wobble */
  function noise(x,y,t){
    return Math.sin(x*0.006+t)*0.5 + Math.sin(y*0.008-t*0.7)*0.4 +
           Math.sin((x+y)*0.004+t*1.3)*0.35;
  }

  function gustNow(){
    var g=Math.sin(performance.now()/730)*0.5+Math.sin(performance.now()/290)*0.3+
      Math.sin(performance.now()/1370)*0.2;
    return wind.live ? g*wind.gust : 0;
  }

  function heading(){ return wind.dir; }

  function vecAt(x,y){
    var rad=(heading())*Math.PI/180;
    var gx=Math.cos(rad-Math.PI/2), gy=Math.sin(rad-Math.PI/2); /* 0° = north = up */
    var wob=noise(x,y,performance.now()/2600)*0.55;
    var s=wind.spd*(1+wob*0.4)*(1+gustNow()*0.6);
    /* lateral deflection around obstacles (three hill bumps) */
    var lx=0, ly=0;
    HILLS.forEach(function(hl){
      var dx=x-hl.x, dy=y-hl.y, d2=dx*dx+dy*dy, r2=hl.r*hl.r;
      if(d2<r2*6){
        var f=(1-d2/(r2*6))*0.9;
        var d=Math.sqrt(d2)||1;
        lx+=dx/d*f; ly+=dy/d*f;
      }
    });
    return {x:(gx+lx*0.5)*s, y:(gy+ly*0.5)*s, s:s};
  }

  var HILLS=[{x:190,y:380,r:70},{x:520,y:170,r:60},{x:640,y:420,r:50}];

  function drawGround(){
    ctx.fillStyle="#101a20";
    ctx.fillRect(0,0,W,H);
    /* hills */
    HILLS.forEach(function(hl){
      var g=ctx.createRadialGradient(hl.x,hl.y,4,hl.x,hl.y,hl.r*1.7);
      g.addColorStop(0,"rgba(38,52,59,.95)");
      g.addColorStop(1,"rgba(38,52,59,0)");
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(hl.x,hl.y,hl.r*1.7,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="rgba(123,150,160,.35)";
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(hl.x,hl.y,hl.r*0.55,0,Math.PI*2); ctx.stroke();
    });
    /* grid */
    ctx.strokeStyle="rgba(38,52,59,.85)";
    for(var x=0;x<=W;x+=65){ ctx.beginPath(); ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,H); ctx.stroke(); }
    for(var y=0;y<=H;y+=65){ ctx.beginPath(); ctx.moveTo(0,y+.5); ctx.lineTo(W,y+.5); ctx.stroke(); }
    /* station mast at centre */
    ctx.strokeStyle="#ffb648"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(W/2-14,H/2+18); ctx.lineTo(W/2+14,H/2+18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W/2,H/2+18); ctx.lineTo(W/2,H/2-22); ctx.stroke();
    ctx.fillStyle="#ffb648";
    ctx.beginPath(); ctx.arc(W/2,H/2-24,4,0,Math.PI*2); ctx.fill();
  }
  drawGround();

  var bg=null;
  function snapshot(){ bg=ctx.getImageData(0,0,W,H); }
  snapshot();

  function frame(){
    if(bg) ctx.putImageData(bg,0,0);
    else drawGround();

    var rad=heading()*Math.PI/180;
    var ux=Math.cos(rad-Math.PI/2), uy=Math.sin(rad-Math.PI/2);
    var g=gustNow();
    var speedPx=(0.5+wind.spd/16)*(1+g*0.5);

    ctx.lineCap="round";
    particles.forEach(function(p){
      var v=vecAt(p.x,p.y);
      var nx=p.x+v.x*speedPx*0.55;
      var ny=p.y+v.y*speedPx*0.55;
      var alpha=Math.min(1,(p.life-p.age)/30)*0.55;
      ctx.strokeStyle=(p.hue>0.86)?"rgba(255,182,72,"+alpha.toFixed(2)+")":
        "rgba(121,198,230,"+alpha.toFixed(2)+")";
      ctx.lineWidth=p.hue>0.86?1.6:1;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(nx,ny); ctx.stroke();
      p.x=nx; p.y=ny; p.age++;
      if(p.age>p.life||p.x<-8||p.x>W+8||p.y<-8||p.y>H+8){
        p.x=Math.random()*W; p.y=Math.random()*H; p.age=0; p.life=60+Math.random()*70;
      }
    });

    /* vane arrow over the mast */
    var cx=W/2, cy=H/2-60, len=30+wind.spd*1.1;
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(rad);
    ctx.fillStyle="#ffb648";
    ctx.beginPath(); ctx.moveTo(0,-len); ctx.lineTo(7,8); ctx.lineTo(0,2); ctx.lineTo(-7,8);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle="rgba(255,182,72,.9)";
    ctx.font="11px 'Segoe UI',sans-serif";
    ctx.fillText(Math.round(wind.dir)+"°", cx+16, cy+4);
  }

  function step(){
    frame();
    if(!reduce) requestAnimationFrame(step);
  }

  /* readouts */
  function cardinal(deg){
    var names=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
    return names[Math.round(deg/22.5)%16];
  }
  function beaufort(kt){
    var bands=[[1,"F0"],[3,"F1"],[6,"F2"],[10,"F3"],[16,"F4"],[21,"F5"],[27,"F6"],
      [33,"F7"],[40,"F8"],[47,"F9"]];
    var out="F0";
    bands.forEach(function(b){ if(kt>=b[0]) out=b[1]; });
    if(kt>47) out="F9+";
    return out;
  }
  function readouts(){
    var gNow=Math.max(0,Math.round(wind.spd*(1+Math.max(0,gustNow()))));
    var card=cardinal(wind.dir);
    G("hdg").textContent=("00"+Math.round(wind.dir)).slice(-3)+"°";
    G("gustHd").textContent=gNow;
    G("rdMean").textContent=Math.round(wind.spd);
    G("rdGust").textContent=gNow;
    G("rdCard").textContent=card;
    G("rdBeau").textContent=beaufort(wind.spd);
    G("flag").textContent=card+" "+Math.round(wind.spd)+" kt";
    document.getElementById("roseNeedle").setAttribute("transform",
      "rotate("+wind.dir.toFixed(1)+" 100 100)");
    /* scale about the hub, not the SVG origin, so the pointer stays pinned */
    document.getElementById("roseGust").setAttribute("transform",
      "rotate("+wind.dir.toFixed(1)+" 100 100) translate(100 100) scale(1 "+
      (0.6+Math.max(0,gustNow())).toFixed(2)+") translate(-100 -100)");
    document.getElementById("roseGust").style.opacity=
      Math.max(0,Math.min(1,Math.max(0,gustNow())+0.25)).toFixed(2);
    if(reduce && bg) frame();   /* static mode: repaint on every reading */
  }

  var stick=document.getElementById("stick");
  function pushStick(){
    var li=document.createElement("li");
    var t=new Date(), p=function(v){return (v<10?"0":"")+v;};
    li.innerHTML="<span>"+p(t.getMinutes())+":"+p(t.getSeconds())+" "+cardinal(wind.dir)+"</span>"+
      "<b>"+Math.round(wind.spd)+" kt</b>";
    stick.insertBefore(li,stick.firstChild);
    while(stick.children.length>6) stick.removeChild(stick.lastChild);
  }

  /* controls */
  G("dirIn").addEventListener("input",function(){
    wind.dir=parseInt(this.value,10);
    G("dirOut").textContent=wind.dir+"°";
    readouts();
  });
  G("spdIn").addEventListener("input",function(){
    wind.spd=parseInt(this.value,10);
    G("spdOut").textContent=wind.spd;
    readouts();
  });
  G("gstIn").addEventListener("input",function(){
    wind.gust=parseInt(this.value,10)/100;
    G("gstOut").textContent=this.value;
    readouts();
  });
  G("drift").addEventListener("click",function(){
    wind.veering=!wind.veering;
    this.classList.toggle("on",wind.veering);
    if(wind.veering) G("calm").classList.remove("on");
    if(!wind.veering && !wind.live) G("calm").classList.add("on");
  });
  G("calm").addEventListener("click",function(){
    wind.live=!wind.live;
    this.classList.toggle("on",wind.live);
    this.textContent=wind.live?"live gusts":"steady flow";
    if(!wind.live) wind.veering=false, G("drift").classList.remove("on");
  });

  /* drag the field to steer */
  var dragging=false;
  function steer(e){
    var r=cv.getBoundingClientRect();
    var x=(e.clientX-r.left)*W/r.width-r.width*0;
    var y=(e.clientY-r.top)*H/r.height;
    var cx=r.width/2, cy=r.height/2;
    var dx=(e.clientX-r.left)-cx, dy=(e.clientY-r.top)-cy;
    var deg=(Math.atan2(dx,-dy)*180/Math.PI+360)%360;
    wind.dir=Math.round(deg);
    G("dirIn").value=wind.dir;
    G("dirOut").textContent=wind.dir+"°";
    readouts();
  }
  cv.addEventListener("pointerdown",function(e){
    dragging=true; cv.setPointerCapture(e.pointerId); steer(e);
  });
  cv.addEventListener("pointermove",function(e){ if(dragging) steer(e); });
  cv.addEventListener("pointerup",function(){ dragging=false; });
  cv.style.cursor="grab";

  /* loops */
  var last=0;
  function tick(t){
    if(wind.veering){
      wind.dir=(wind.dir+0.18)%360;
      G("dirIn").value=Math.round(wind.dir);
      G("dirOut").textContent=Math.round(wind.dir)+"°";
    }
    if(t-last>240){ readouts(); last=t; }
    requestAnimationFrame(tick);
  }
  readouts();
  pushStick();
  if(!reduce){
    setInterval(pushStick,4000);
    requestAnimationFrame(step);
    requestAnimationFrame(tick);
  }else{
    step();                    /* one static frame of the flow field */
  }
})();
</script>
</body>
</html>
