<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traffic Junction</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#1b1f24;display:flex;flex-direction:column;align-items:center;gap:16px;padding:26px 14px;
  font-family:ui-monospace,Menlo,Consolas,monospace;color:#9fb0bd}
h1{font-size:14px;letter-spacing:.34em;text-transform:uppercase;color:#e8c56a;font-weight:500}
#wrap{position:relative;border:1px solid #333c44;border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5)}
canvas{display:block;background:#2a2d31}
#panel{display:flex;gap:22px;align-items:center;background:#14181c;border:1px solid #333c44;border-radius:12px;padding:13px 20px;font-size:11px;flex-wrap:wrap;justify-content:center}
.row{display:flex;align-items:center;gap:8px}
.row label{color:#7c8d9a;letter-spacing:.1em}
input[type=range]{width:110px;accent-color:#e8c56a}
button{background:#232a30;border:1px solid #3d4750;color:#e8c56a;font:inherit;font-size:11px;padding:6px 13px;border-radius:7px;cursor:pointer;letter-spacing:.1em}
button:hover{background:#2d363e}
#stats{display:flex;gap:26px;font-size:11px;justify-content:center}
#stats b{color:#7fd7a8;font-weight:600}
#stats .q b{color:#ff9d7a}
</style>
</head>
<body>
<h1>Junction 4B — signal study</h1>
<div id="wrap"><canvas id="cv" width="720" height="520"></canvas></div>
<div id="panel">
  <div class="row"><label>GREEN</label><input id="green" type="range" min="3" max="12" step="0.5" value="6"><span id="greenV">6.0s</span></div>
  <div class="row"><label>TRAFFIC</label><input id="rate" type="range" min="1" max="10" value="5"><span id="rateV">5</span></div>
  <div class="row"><label>SPEED</label><input id="spd" type="range" min="25" max="200" value="100"><span id="spdV">1.00x</span></div>
  <button id="pause">pause</button>
</div>
<div id="stats">
  <span class="q">waiting <b id="sWait">0</b></span>
  <span>on road <b id="sCars">0</b></span>
  <span>cleared <b id="sDone">0</b></span>
  <span>longest queue <b id="sMax">0</b></span>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=cv.width,H=cv.height,cx=W/2,cy=H/2,RW=140,LANE=34;
var green=6,rate=5,speedMul=1,paused=false;
var cars=[],spawnAcc=0,done=0,maxQ=0,tt=0;
// phase: 0 NS green, 1 NS yellow, 2 all red, 3 EW green, 4 EW yellow, 5 all red
var phase=0,phaseT=0;
function phaseDur(){
  if(phase===0||phase===3)return green;
  if(phase===1||phase===4)return 1.3;
  return .7;
}
function nsState(){return phase<2?(phase===1?"yellow":"green"):"red";}
function ewState(){if(phase===3)return"green";if(phase===4)return"yellow";return"red";}
// approaches: 0=E-bound (horizontal +x), 1=S-bound (vertical +y), 2=W-bound, 3=N-bound
var COL=["#d9534f","#e0a43a","#5fa867","#8d7bd6","#c9713f","#5f9bd6","#c85f8f","#78b0a2"];
function spawn(axis){
  var dirIdx=Math.floor(Math.random()*4);
  var long=(Math.random()<.22)?52:34;
  var c={a:dirIdx,len:long,w:20,v:0,maxv:2.1+Math.random()*.9,c:COL[Math.floor(Math.random()*COL.length)],passed:false};
  if(dirIdx===0){c.lane=cy-LANE;c.pos=-long-10;c.sgn=1;}
  if(dirIdx===1){c.lane=cx+LANE;c.pos=-long-10;c.sgn=1;}
  if(dirIdx===2){c.lane=cy+LANE;c.pos=W+long+10;c.sgn=-1;}
  if(dirIdx===3){c.lane=cx-LANE;c.pos=H+long+10;c.sgn=-1;}
  cars.push(c);
}
function stopLineDist(c){
  var sl;
  if(c.a===0)sl=cx-RW/2-10;
  else if(c.a===2)sl=cx+RW/2+10;
  else if(c.a===1)sl=cy-RW/2-10;
  else sl=cy+RW/2+10;
  return (sl-c.pos)*c.sgn;
}
function lightFor(c){
  var horiz=(c.a===0||c.a===2);
  return horiz?ewState():nsState();
}
function update(dt){
  spawnAcc+=dt;
  var interval=3.4/rate;
  while(spawnAcc>interval){spawnAcc-=interval;spawn(Math.random()<.5?0:1);}
  phaseT+=dt;
  if(phaseT>phaseDur()){phaseT=0;phase=(phase+1)%6;}
  var wait=0;
  for(var i=cars.length-1;i>=0;i--){
    var c=cars[i];
    var target=c.maxv;
    var d=stopLineDist(c);
    var L=lightFor(c);
    var inJunction=d<0&&d>-(RW+40);
    if((L==="red"||(L==="yellow"&&d>26))&&d>0&&d<130){
      target=Math.max(0,(d-8)/130*c.maxv);
      if(d<14)target=0;
    }
    // car ahead gap
    for(var j=0;j<cars.length;j++){
      if(j===i)continue;
      var o=cars[j];
      if(o.a!==c.a)continue;
      var gap=(o.pos-c.pos)*c.sgn;
      if(gap>0&&gap<c.len+o.len+12){
        target=Math.min(target,Math.max(0,(gap-c.len-10)/40*c.maxv));
      }
    }
    if(target<c.v)c.v=Math.max(target,c.v-0.09);
    else c.v=Math.min(target,c.v+0.05);
    c.pos+=c.v*c.sgn;
    if(L==="red"&&d>=0&&d<70)wait++;
    if(!c.passed&&d<-(RW/2+6)){c.passed=true;done++;}
    var gone=(c.a===0&&c.pos>W+90)||(c.a===2&&c.pos<-90)||(c.a===1&&c.pos>H+90)||(c.a===3&&c.pos<-90);
    if(gone)cars.splice(i,1);
  }
  maxQ=Math.max(maxQ,wait);
  document.getElementById("sWait").textContent=wait;
  document.getElementById("sCars").textContent=cars.length;
  document.getElementById("sDone").textContent=done;
  document.getElementById("sMax").textContent=maxQ;
}
function drawLight(x,y,state,horiz){
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle="#101215";ctx.strokeStyle="#3a4046";ctx.lineWidth=2;
  var w=horiz?52:16,h=horiz?16:52;
  ctx.beginPath();ctx.rect(-w/2,-h/2,w,h);ctx.fill();ctx.stroke();
  var cols=["#ff5b4a","#ffc93d","#4de071"];
  for(var i=0;i<3;i++){
    var px,py;
    if(horiz){px=-16+i*16;py=0;}else{px=0;py=-16+i*16;}
    var on=(i===0&&state==="red")||(i===1&&state==="yellow")||(i===2&&state==="green");
    ctx.beginPath();ctx.arc(px,py,4.6,0,6.283);
    ctx.fillStyle=on?cols[i]:"#2b3035";
    if(on){ctx.shadowColor=cols[i];ctx.shadowBlur=10;}else ctx.shadowBlur=0;
    ctx.fill();
  }
  ctx.shadowBlur=0;ctx.restore();
}
function draw(){
  ctx.fillStyle="#2a2d31";ctx.fillRect(0,0,W,H);
  // grass corners
  ctx.fillStyle="#31413a";
  [[0,0],[W,0],[0,H],[W,H]].forEach(function(p){
    ctx.beginPath();ctx.moveTo(p[0],p[1]);
    var sx=p[0]===0?1:-1,sy=p[1]===0?1:-1;
    ctx.lineTo(p[0]+sx*(W/2-RW/2-6),p[1]);
    ctx.lineTo(p[0],p[1]+sy*(H/2-RW/2-6));
    ctx.closePath();ctx.fill();
  });
  // roads
  ctx.fillStyle="#22252a";
  ctx.fillRect(0,cy-RW/2,W,RW);
  ctx.fillRect(cx-RW/2,0,RW,H);
  ctx.fillStyle="#262a2f";ctx.fillRect(cx-RW/2,cy-RW/2,RW,RW);
  // lane dividers
  ctx.strokeStyle="#c9c2a8";ctx.lineWidth=2;ctx.setLineDash([14,12]);
  ctx.beginPath();
  ctx.moveTo(0,cy);ctx.lineTo(cx-RW/2-4,cy);ctx.moveTo(cx+RW/2+4,cy);ctx.lineTo(W,cy);
  ctx.moveTo(cx,0);ctx.lineTo(cx,cy-RW/2-4);ctx.moveTo(cx,cy+RW/2+4);ctx.lineTo(cx,H);
  ctx.stroke();ctx.setLineDash([]);
  // stop lines + crosswalks
  ctx.fillStyle="rgba(230,228,215,.55)";
  ctx.fillRect(cx-RW/2-14,cy-RW/2+6,7,RW-12);
  ctx.fillRect(cx+RW/2+7,cy-RW/2+6,7,RW-12);
  ctx.fillRect(cx-RW/2+6,cy-RW/2-14,RW-12,7);
  ctx.fillRect(cx-RW/2+6,cy+RW/2+7,RW-12,7);
  // zebra crossings
  ctx.fillStyle="rgba(240,238,228,.34)";
  for(var z=0;z<6;z++){
    ctx.fillRect(cx-RW/2+8+z*22,cy-RW/2-30,13,12);
    ctx.fillRect(cx-RW/2+8+z*22,cy+RW/2+18,13,12);
    ctx.fillRect(cx-RW/2-30,cy-RW/2+8+z*22,12,13);
    ctx.fillRect(cx+RW/2+18,cy-RW/2+8+z*22,12,13);
  }
  // cars
  for(var i=0;i<cars.length;i++){
    var c=cars[i],x,y,ang;
    if(c.a===0){x=c.pos;y=c.lane;ang=0;}
    if(c.a===2){x=c.pos;y=c.lane;ang=Math.PI;}
    if(c.a===1){x=c.lane;y=c.pos;ang=Math.PI/2;}
    if(c.a===3){x=c.lane;y=c.pos;ang=-Math.PI/2;}
    ctx.save();ctx.translate(x,y);ctx.rotate(ang);
    ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.rect(-c.len/2+2,-c.w/2+3,c.len,c.w);ctx.fill();
    ctx.fillStyle=c.c;ctx.beginPath();
    ctx.rect(-c.len/2,-c.w/2,c.len,c.w);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.22)";ctx.fillRect(-c.len/2+c.len*.22,-c.w/2+3,c.len*.34,c.w-6);
    ctx.fillStyle="#dfe6ea";ctx.fillRect(-c.len/2+2,-c.w/2+2,4,c.w-4);
    if(c.v<.25){ctx.fillStyle="#ff4b3e";ctx.shadowColor="#ff4b3e";ctx.shadowBlur=7;
      ctx.fillRect(c.len/2-4,-c.w/2+2,3,5);ctx.fillRect(c.len/2-4,c.w/2-7,3,5);ctx.shadowBlur=0;}
    ctx.restore();
  }
  // signal heads
  drawLight(cx-RW/2-40,cy-RW/2-30,nsState(),false);
  drawLight(cx+RW/2+40,cy+RW/2+30,nsState(),false);
  drawLight(cx-RW/2-30,cy+RW/2+40,ewState(),true);
  drawLight(cx+RW/2+30,cy-RW/2-40,ewState(),true);
}
var last=0;
function loop(now){
  var dt=Math.min(.05,(now-last)/1000||0);last=now;
  if(!paused){var steps=dt*speedMul;update(steps);}
  draw();
  requestAnimationFrame(loop);
}
document.getElementById("green").addEventListener("input",function(){green=+this.value;document.getElementById("greenV").textContent=green.toFixed(1)+"s";});
document.getElementById("rate").addEventListener("input",function(){rate=+this.value;document.getElementById("rateV").textContent=rate;});
document.getElementById("spd").addEventListener("input",function(){speedMul=+this.value/100;document.getElementById("spdV").textContent=speedMul.toFixed(2)+"x";});
document.getElementById("pause").addEventListener("click",function(){paused=!paused;this.textContent=paused?"resume":"pause";});
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
