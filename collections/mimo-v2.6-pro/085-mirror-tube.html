<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mirror Tube — Kaleidoscope</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0c0a11;color:#b3aec2;font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;gap:13px;padding:22px 14px}
h1{font-size:12px;letter-spacing:.4em;color:#c98fd8;text-transform:uppercase}
h1 i{font-style:normal;color:#8fc9d8}
#rig{background:#141119;border:1px solid #241f2e;border-radius:12px;padding:14px}
canvas{display:block;border-radius:50%;background:#07060b;box-shadow:0 0 40px rgba(140,90,190,.18) inset;cursor:crosshair;touch-action:none}
.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;justify-content:center;width:100%;max-width:860px}
button{background:#16121f;border:1px solid #2b2438;color:#bdb6cf;font:inherit;font-size:9.5px;padding:8px 12px;border-radius:7px;cursor:pointer;letter-spacing:.14em;transition:.15s}
button:hover{border-color:#c98fd8;color:#f6eaff}
button.on{background:#c98fd8;border-color:#c98fd8;color:#22102a;font-weight:700}
label{font-size:9.5px;letter-spacing:.14em;color:#6d6780;display:flex;gap:7px;align-items:center}
input[type=range]{width:100px;accent-color:#c98fd8}
select{background:#16121f;border:1px solid #2b2438;color:#bdb6cf;font:inherit;font-size:9.5px;padding:7px 9px;border-radius:6px}
select:focus{outline:none;border-color:#c98fd8}
.stat{font-size:9.5px;letter-spacing:.16em;color:#6d6780}
.stat b{color:#8fc9d8}
.hint{font-size:9.5px;letter-spacing:.14em;color:#474255;text-align:center;max-width:850px;line-height:1.9}
</style>
</head>
<body>
<h1>Mirror Tube <i>M85</i> · kaleidoscope</h1>
<div id="rig"><canvas id="cv" width="560" height="560"></canvas></div>
<div class="bar">
  <label>mirrors <input type="range" id="mir" min="3" max="16" value="6"></label>
  <label>spin <input type="range" id="spin" min="0" max="100" value="26"></label>
  <label>trail <input type="range" id="trail" min="0" max="100" value="62"></label>
  <label>glass
    <select id="pal">
      <option value="jewel">JEWEL</option>
      <option value="neon">NEON</option>
      <option value="amber">AMBER</option>
      <option value="ice">ICE</option>
    </select>
  </label>
  <button id="bRing" class="on">◎ RING SEED</button>
  <button id="bFlip">⇄ FLIP</button>
  <button id="bClear">✦ EMPTY TUBE</button>
  <span class="stat">chips <b id="mC">0</b> · facets <b id="mF">6</b> · θ <b id="mT">0°</b></span>
</div>
<div class="hint">loose glass chips you place inside ONE wedge are mirrored into every facet around the tube · drag inside the circle to spill more chips · spin and trail reshape the whole rosette in real time</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ax=cv.getContext("2d");
var S=560,cx=S/2,cy=S/2,RR=S/2-6;
var buf=document.createElement("canvas");buf.width=S;buf.height=S;
var bx=buf.getContext("2d");
var chips=[],mir=6,spin=0.26,trail=0.62,flip=1,theta=0;
var PALS={
  jewel:["#e0574f","#4f9fe0","#e0c44f","#57c98f","#a45fe0","#e05fb4"],
  neon:["#39ff88","#ff2fd0","#2fffe8","#f8ff2f","#ff6b2f","#8f2fff"],
  amber:["#ffb02f","#ff7a1f","#ffe08f","#d8641f","#c9963f","#fff2c9"],
  ice:["#bff0ff","#7fd8ff","#e8fbff","#9fb8ff","#cfe8ff","#ffffff"]
};
var pal=PALS.jewel;
function seedRing(){
  chips=[];
  var n=7+Math.floor(Math.random()*6);
  var a0=Math.random()*6.2832;
  for(var i=0;i<n;i++){
    var a=a0+Math.random()*1.0;
    var r=RR*(0.18+Math.random()*0.7);
    chips.push(mkChip(cx+Math.cos(a)*r*flip,cy+Math.sin(a)*r));
  }
}
function mkChip(x,y){
  var sides=3+Math.floor(Math.random()*5);
  var pts=[];
  for(var i=0;i<sides;i++)pts.push(Math.random());
  return {
    x:x,y:y,
    s:5+Math.random()*13,
    a:Math.random()*6.2832,
    va:(Math.random()-0.5)*0.04,
    vx:(Math.random()-0.5)*0.5,
    vy:(Math.random()-0.5)*0.5,
    c:pal[Math.floor(Math.random()*pal.length)],
    pts:pts
  };
}
function ppos(e){
  var r=cv.getBoundingClientRect();
  return [(e.clientX-r.left)*S/r.width,(e.clientY-r.top)*S/r.height];
}
var down=false,last=null;
cv.addEventListener("pointerdown",function(e){
  down=true;cv.setPointerCapture(e.pointerId);last=ppos(e);
  var p=last;
  if(Math.hypot(p[0]-cx,p[1]-cy)<=RR)chips.push(mkChip(p[0],p[1]));
});
cv.addEventListener("pointermove",function(e){
  if(!down)return;
  var p=ppos(e);
  if(last){
    var d=Math.hypot(p[0]-last[0],p[1]-last[1]);
    if(d>22&&Math.hypot(p[0]-cx,p[1]-cy)<=RR){
      chips.push(mkChip(p[0],p[1]));last=p;
      if(chips.length>140)chips.shift();
    }
  }else last=p;
});
cv.addEventListener("pointerup",function(){down=false;last=null;});
cv.addEventListener("pointercancel",function(){down=false;last=null;});
document.getElementById("mir").addEventListener("input",function(){
  mir=Number(this.value);document.getElementById("mF").textContent=mir;
});
document.getElementById("spin").addEventListener("input",function(){spin=Number(this.value)/100;});
document.getElementById("trail").addEventListener("input",function(){trail=Number(this.value)/100;});
document.getElementById("pal").addEventListener("change",function(){
  pal=PALS[this.value];
  chips.forEach(function(c){if(Math.random()<0.6)c.c=pal[Math.floor(Math.random()*pal.length)];});
});
document.getElementById("bRing").addEventListener("click",seedRing);
document.getElementById("bFlip").addEventListener("click",function(){flip*=-1;seedRing();});
document.getElementById("bClear").addEventListener("click",function(){chips=[];});
function stepSim(){
  for(var i=0;i<chips.length;i++){
    var c=chips[i];
    c.a+=c.va;
    c.x+=c.vx;c.y+=c.vy;
    c.vx*=0.992;c.vy*=0.992;
    // gentle swirl
    var dx=c.x-cx,dy=c.y-cy;
    c.vx+=-dy*0.0006;c.vy+=dx*0.0006;
    var d=Math.hypot(dx,dy);
    if(d>RR-10){
      var nx=dx/d,ny=dy/d;
      var dot=c.vx*nx+c.vy*ny;
      c.vx-=2*dot*nx;c.vy-=2*dot*ny;
      c.x=cx+nx*(RR-10);c.y=cy+ny*(RR-10);
    }
  }
}
function drawChip(g,c){
  g.save();
  g.translate(c.x,c.y);
  g.rotate(c.a);
  g.beginPath();
  var n=c.pts.length;
  for(var i=0;i<n;i++){
    var a=i/n*6.2832;
    var r=c.s*(0.55+c.pts[i]*0.75);
    if(i===0)g.moveTo(Math.cos(a)*r,Math.sin(a)*r);
    else g.lineTo(Math.cos(a)*r,Math.sin(a)*r);
  }
  g.closePath();
  g.globalAlpha=0.88;
  g.fillStyle=c.c;
  g.fill();
  g.globalAlpha=1;
  g.lineWidth=1.2;
  g.strokeStyle="rgba(255,255,255,.65)";
  g.stroke();
  // inner facet highlight
  g.beginPath();
  g.moveTo(-c.s*0.4,-c.s*0.15);
  g.lineTo(c.s*0.15,-c.s*0.45);
  g.globalAlpha=0.7;
  g.lineWidth=2;
  g.strokeStyle="rgba(255,255,255,.9)";
  g.stroke();
  g.restore();
}
function render(){
  theta+=spin*0.01;
  // buffer trail fade
  bx.globalCompositeOperation="source-over";
  bx.fillStyle="rgba(7,6,11,"+(0.03+trail*0.14)+")";
  bx.fillRect(0,0,S,S);
  bx.globalCompositeOperation="lighter";
  for(var i=0;i<chips.length;i++)drawChip(bx,chips[i]);
  // main tube
  ax.fillStyle="#07060b";ax.fillRect(0,0,S,S);
  var wedge=6.2832/mir;
  for(var k=0;k<mir;k++){
    ax.save();
    ax.translate(cx,cy);
    ax.rotate(theta+k*wedge);
    ax.beginPath();
    ax.moveTo(0,0);
    ax.arc(0,0,RR*1.45,-wedge/2,wedge/2);
    ax.closePath();
    ax.clip();
    if(k%2===1&&flip===-1){ax.scale(-1,1);}
    ax.drawImage(buf,-cx,-cy);
    ax.restore();
  }
  // mirror seams
  ax.save();
  ax.translate(cx,cy);
  ax.rotate(theta);
  for(var m=0;m<mir;m++){
    ax.rotate(wedge);
    ax.strokeStyle="rgba(220,215,240,.30)";
    ax.lineWidth=1;
    ax.beginPath();ax.moveTo(0,0);ax.lineTo(RR,0);ax.stroke();
  }
  ax.restore();
  // tube bezel
  ax.strokeStyle="#241f2e";
  ax.lineWidth=10;
  ax.beginPath();ax.arc(cx,cy,RR+3,0,6.2832);ax.stroke();
  ax.strokeStyle="rgba(201,143,216,.35)";
  ax.lineWidth=2;
  ax.beginPath();ax.arc(cx,cy,RR+9,0,6.2832);ax.stroke();
  document.getElementById("mT").textContent=Math.round(theta*57.2958%360)+"°";
}
var mt=0;
function loop(now){
  stepSim();
  render();
  if(now-mt>400){
    mt=now;
    document.getElementById("mC").textContent=chips.length;
    document.getElementById("mF").textContent=mir;
  }
  requestAnimationFrame(loop);
}
seedRing();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
