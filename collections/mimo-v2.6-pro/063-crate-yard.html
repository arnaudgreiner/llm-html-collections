<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crate Yard — Sokoban Shift</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b100d;color:#a8b8ae;font-family:ui-monospace,Menlo,Consolas,monospace;
  display:flex;justify-content:center;padding:30px 14px}
#app{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
#side{width:210px;background:#111a15;border:1px solid #24352b;border-radius:12px;padding:16px}
h1{font-size:13px;letter-spacing:.3em;color:#e08b3c;text-transform:uppercase;margin-bottom:4px}
#sub{font-size:10px;letter-spacing:.12em;color:#5e7268;margin-bottom:14px;line-height:1.7}
#levels{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.lv{display:flex;justify-content:space-between;align-items:center;background:#16211b;border:1px solid #24352b;
  border-radius:7px;padding:8px 10px;font-size:11px;letter-spacing:.08em;color:#a8b8ae;cursor:pointer}
.lv:hover{border-color:#e08b3b}
.lv.cur{border-color:#e08b3c;color:#e08b3c;background:#1b2117}
.lv .st{color:#f4c15d}
button{background:#16211b;border:1px solid #24352b;color:#a8b8ae;font:10px ui-monospace,monospace;
  letter-spacing:.14em;padding:8px 10px;border-radius:7px;cursor:pointer;width:100%;margin-bottom:6px}
button:hover{border-color:#e08b3c}
#main{display:flex;flex-direction:column;gap:12px;align-items:center}
#wrap{background:#0f1712;border:1px solid #24352b;border-radius:12px;padding:14px;box-shadow:0 22px 55px rgba(0,0,0,.55)}
canvas{display:block;border-radius:6px}
#hud{display:flex;gap:22px;font-size:11px;letter-spacing:.12em;color:#5e7268}
#hud b{color:#e08b3c;font-weight:600}
#keys{font-size:10px;letter-spacing:.1em;color:#4f635a;text-align:center;line-height:1.9;max-width:460px}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>Crate Yard</h1>
    <div id="sub">SOKOBAN SHIFT LOG · stack every crate on its pad before the yard closes</div>
    <div id="levels"></div>
    <button id="undo">undo (Z)</button>
    <button id="restart">restart (R)</button>
    <button id="next">next shift (N)</button>
    <button id="prev">previous (P)</button>
  </div>
  <div id="main">
    <div id="wrap"><canvas id="cv" width="440" height="308"></canvas></div>
    <div id="hud">
      <div>SHIFT <b id="lvName">01 Push Off</b></div>
      <div>MOVES <b id="mv">0</b></div>
      <div>PUSHES <b id="pv">0</b></div>
      <div>BEST <b id="best">—</b></div>
    </div>
    <div id="keys">arrows / WASD to walk · walk into a crate to shove it · crates shove back into walls, other crates or dead corners — undo is free · a star marks a shift cleared</div>
  </div>
</div>
<script>
(function(){
"use strict";
var LEVELS=[
 {n:"01 Push Off",g:["#######","#     #","#  @  #","#  $  #","#  .  #","#######"]},
 {n:"02 Pair",g:["#########","#  . .  #","#  $ $  #","#   @   #","#       #","#########"]},
 {n:"03 Detour",g:["#########","#   #  .#","# $ #   #","#   #   #","#  @    #","#       #","#########"]},
 {n:"04 Triangle",g:["#########","# .   . #","# $ $   #","#   @   #","#   $ . #","#########"]},
 {n:"05 The Yard",g:["##########","#  . .   #","# $ ## $ #","#   ##   #","#   @    #","# .    $ #","##########"]},
 {n:"06 Dock Split",g:["##########","#    .   #","#  $ $   #","#  ###   #","#    @   #","#  .     #","##########"]}
];
var TILE=44;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var idx=0,grid=null,cols=0,rows=0,goals=null,boxes=null,player={x:0,y:0};
var moves=0,pushes=0,undoStack=[],solved=false,anim=null,facing={x:0,y:1};
var stars={};
try{stars=JSON.parse(localStorage.getItem("crateyard-stars")||"{}");}catch(e){stars={};}
function saveStars(){try{localStorage.setItem("crateyard-stars",JSON.stringify(stars));}catch(e){}}
function inWall(x,y){
  if(x<0||y<0||y>=rows||x>=cols)return true;
  var r=grid[y]||"";
  if(x>=r.length)return true;
  return r.charAt(x)==="#";
}
function boxAt(x,y){
  for(var i=0;i<boxes.length;i++)if(boxes[i].x===x&&boxes[i].y===y)return i;
  return -1;
}
function goalAt(x,y){
  for(var i=0;i<goals.length;i++)if(goals[i].x===x&&goals[i].y===y)return true;
  return false;
}
function load(i){
  idx=(i+LEVELS.length)%LEVELS.length;
  var g=LEVELS[idx].g;
  grid=g;rows=g.length;cols=0;
  g.forEach(function(r){if(r.length>cols)cols=r.length;});
  goals=[];boxes=[];undoStack=[];moves=0;pushes=0;solved=false;anim=null;
  for(var y=0;y<rows;y++){
    for(var x=0;x<g[y].length;x++){
      var ch=g[y].charAt(x);
      if(ch==="#")continue;
      if(ch==="."||ch==="*"||ch==="+")goals.push({x:x,y:y});
      if(ch==="$"||ch==="*")boxes.push({x:x,y:y});
      if(ch==="@"||ch==="+"){player={x:x,y:y};facing={x:0,y:1};}
    }
  }
  cv.width=cols*TILE;cv.height=rows*TILE;
  document.getElementById("lvName").textContent=LEVELS[idx].n;
  updateHud();renderLevels();
}
function updateHud(){
  document.getElementById("mv").textContent=moves;
  document.getElementById("pv").textContent=pushes;
  document.getElementById("best").textContent=stars[idx]!==undefined?stars[idx]+" moves":"—";
}
function renderLevels(){
  var box=document.getElementById("levels");box.innerHTML="";
  LEVELS.forEach(function(L,i){
    var d=document.createElement("div");
    d.className="lv"+(i===idx?" cur":"");
    d.innerHTML="<span>"+L.n+"</span><span class='st'>"+(stars[i]!==undefined?"★":"·")+"</span>";
    d.addEventListener("click",function(){load(i);});
    box.appendChild(d);
  });
}
function snapshot(){
  undoStack.push({p:{x:player.x,y:player.y},
    b:boxes.map(function(b){return {x:b.x,y:b.y};}),
    m:moves,pb:pushes,s:solved,f:{x:facing.x,y:facing.y}});
}
function restore(s){
  player=s.p;boxes=s.b;moves=s.m;pushes=s.pb;solved=s.s;facing=s.f;anim=null;updateHud();
}
function attempt(dx,dy){
  if(solved)return;
  var nx=player.x+dx,ny=player.y+dy;
  if(inWall(nx,ny))return;
  facing={x:dx,y:dy};
  var bi=boxAt(nx,ny);
  if(bi>=0){
    var bx=nx+dx,by=ny+dy;
    if(inWall(bx,by)||boxAt(bx,by)>=0)return;
    snapshot();
    boxes[bi]={x:bx,y:by};
    anim={t:0,dur:0.14,pFrom:{x:player.x,y:player.y},pTo:{x:nx,y:ny},
      boxFrom:{x:nx,y:ny},boxTo:{x:bx,y:by}};
    player={x:nx,y:ny};pushes++;moves++;
  }else{
    snapshot();
    anim={t:0,dur:0.1,pFrom:{x:player.x,y:player.y},pTo:{x:nx,y:ny},
      boxFrom:null,boxTo:null};
    player={x:nx,y:ny};moves++;
  }
  updateHud();checkWin();
}
function checkWin(){
  var all=boxes.length===goals.length;
  if(all)boxes.forEach(function(b){if(!goalAt(b.x,b.y))all=false;});
  if(!all)return;
  solved=true;
  if(stars[idx]===undefined||moves<stars[idx]){stars[idx]=moves;saveStars();}
  updateHud();renderLevels();
}
function undo(){
  if(!undoStack.length)return;
  restore(undoStack.pop());
}
document.getElementById("undo").addEventListener("click",undo);
document.getElementById("restart").addEventListener("click",function(){load(idx);});
document.getElementById("next").addEventListener("click",function(){load(idx+1);});
document.getElementById("prev").addEventListener("click",function(){load(idx-1);});
document.addEventListener("keydown",function(e){
  var k=e.key.toLowerCase();
  if(k==="arrowup"||k==="w")attempt(0,-1);
  else if(k==="arrowdown"||k==="s")attempt(0,1);
  else if(k==="arrowleft"||k==="a")attempt(-1,0);
  else if(k==="arrowright"||k==="d")attempt(1,0);
  else if(k==="z")undo();
  else if(k==="r")load(idx);
  else if(k==="n")load(idx+1);
  else if(k==="p")load(idx-1);
  else return;
  e.preventDefault();
});
function ease(t){return t<0.5?2*t*t:-1+(4-2*t)*t;}
function px(v){return v*TILE+TILE/2;}
function py(v){return v*TILE+TILE/2;}
function drawBox(cx,cy,onGoal){
  var s=TILE/2-5,x=cx-s,y=cy-s;
  ctx.fillStyle="rgba(0,0,0,.35)";ctx.fillRect(x+3,y+5,s*2,s*2);
  var grd=ctx.createLinearGradient(x,y,x,y+s*2);
  grd.addColorStop(0,onGoal?"#f0a95c":"#c9813f");
  grd.addColorStop(1,onGoal?"#c07a30":"#8f5626");
  ctx.fillStyle=grd;ctx.fillRect(x,y,s*2,s*2);
  ctx.strokeStyle=onGoal?"#ffe1a0":"#5d3a1b";ctx.lineWidth=2;
  ctx.strokeRect(x+1,y+1,s*2-2,s*2-2);
  ctx.strokeStyle=onGoal?"rgba(255,225,160,.7)":"rgba(70,44,20,.7)";ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(x+4,y+4);ctx.lineTo(x+s*2-4,y+s*2-4);
  ctx.moveTo(x+s*2-4,y+4);ctx.lineTo(x+4,y+s*2-4);
  ctx.stroke();
  if(onGoal){ctx.strokeStyle="#ffe1a0";ctx.lineWidth=2;ctx.strokeRect(x-3,y-3,s*2+6,s*2+6);}
}
function drawPlayer(cx,cy){
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.beginPath();ctx.ellipse(cx,cy+9,13,7,0,0,7);ctx.fill();
  ctx.fillStyle="#7ad1c4";
  ctx.beginPath();ctx.arc(cx,cy,13,0,7);ctx.fill();
  ctx.strokeStyle="#1d4a44";ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle="#12332f";
  ctx.beginPath();
  ctx.moveTo(cx+facing.x*11,cy+facing.y*11);
  ctx.lineTo(cx+facing.x*-3+facing.y*6,cy+facing.y*-3+facing.x*6);
  ctx.lineTo(cx+facing.x*-3-facing.y*6,cy+facing.y*-3-facing.x*6);
  ctx.closePath();ctx.fill();
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle="#0f1712";ctx.fillRect(0,0,cv.width,cv.height);
  var k=anim?ease(Math.min(1,anim.t/anim.dur)):1;
  for(var y=0;y<rows;y++){
    for(var x=0;x<cols;x++){
      if(inWall(x,y)){
        var wx=x*TILE,wy=y*TILE;
        ctx.fillStyle="#2c3a33";ctx.fillRect(wx,wy,TILE,TILE);
        ctx.fillStyle="#3a4d43";ctx.fillRect(wx+2,wy+2,TILE-4,TILE/2-2);
        ctx.fillStyle="#22302a";ctx.fillRect(wx+2,wy+TILE/2,TILE-4,TILE/2-2);
        ctx.strokeStyle="#18221d";ctx.lineWidth=1;ctx.strokeRect(wx+.5,wy+.5,TILE-1,TILE-1);
      }else{
        ctx.fillStyle=(x+y)%2?"#16211b":"#182419";
        ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
        if(goalAt(x,y)){
          var gx=px(x),gy=py(y);
          ctx.strokeStyle="#f4c15d";ctx.lineWidth=2;
          ctx.setLineDash([5,4]);
          ctx.beginPath();ctx.arc(gx,gy,13,0,7);ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle="rgba(244,193,93,.12)";
          ctx.beginPath();ctx.arc(gx,gy,13,0,7);ctx.fill();
        }
      }
    }
  }
  boxes.forEach(function(b){
    var cx=px(b.x),cy=py(b.y);
    if(anim&&anim.boxFrom&&anim.boxTo&&anim.boxTo.x===b.x&&anim.boxTo.y===b.y){
      cx=px(anim.boxFrom.x+(anim.boxTo.x-anim.boxFrom.x)*k);
      cy=py(anim.boxFrom.y+(anim.boxTo.y-anim.boxFrom.y)*k);
    }
    drawBox(cx,cy,goalAt(b.x,b.y));
  });
  var ppx=px(player.x),ppy=py(player.y);
  if(anim&&anim.pFrom){
    ppx=px(anim.pFrom.x+(anim.pTo.x-anim.pFrom.x)*k);
    ppy=py(anim.pFrom.y+(anim.pTo.y-anim.pFrom.y)*k);
  }
  drawPlayer(ppx,ppy);
  if(solved){
    ctx.fillStyle="rgba(11,16,13,.74)";ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle="#f4c15d";ctx.font="bold 19px ui-monospace, monospace";ctx.textAlign="center";
    ctx.fillText("SHIFT COMPLETE",cv.width/2,cv.height/2-6);
    ctx.fillStyle="#a8b8ae";ctx.font="11px ui-monospace, monospace";
    ctx.fillText(moves+" moves · "+pushes+" pushes — press N for the next shift",
      cv.width/2,cv.height/2+18);
    ctx.textAlign="left";
  }
}
var last=0;
function frame(ts){
  if(!last)last=ts;
  var dt=Math.min(0.05,(ts-last)/1000);last=ts;
  if(anim){anim.t+=dt;if(anim.t>anim.dur)anim=null;}
  draw();
  requestAnimationFrame(frame);
}
load(0);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
