<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>String Art Loom</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0a0c11;color:#8794a6;font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 14px}
h1{font-size:12px;letter-spacing:.4em;color:#ffb454;text-transform:uppercase}
.frame{position:relative;border-radius:14px;overflow:hidden;border:1px solid #1b222c;box-shadow:0 30px 70px rgba(0,0,0,.55)}
canvas{display:block}
#prev{position:absolute;left:0;top:0;pointer-events:none}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%;max-width:980px;background:#0e1116;border:1px solid #1b222c;border-radius:12px;padding:13px 16px}
.bar label{font-size:9.5px;letter-spacing:.18em;color:#556474;display:flex;gap:7px;align-items:center}
input[type=text]{background:#12161c;border:1px solid #262e38;border-radius:7px;color:#e9eef4;font:inherit;font-size:13px;padding:9px 12px;width:170px;letter-spacing:.24em;text-transform:uppercase;outline:none}
input[type=text]:focus{border-color:#ffb454}
input[type=range]{width:96px;height:3px;appearance:none;background:#1c2530;border-radius:3px;outline:none}
input[type=range]::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:#ffb454;cursor:pointer}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#ffb454;cursor:pointer}
input[type=color]{width:34px;height:30px;border:1px solid #262e38;border-radius:7px;background:#12161c;padding:3px;cursor:pointer}
button{background:#161b22;border:1px solid #2a323d;color:#9fb0c2;font:inherit;font-size:10.5px;padding:9px 15px;border-radius:7px;cursor:pointer;letter-spacing:.14em}
button:hover{border-color:#3d4753}
button.go{background:#ffb454;border-color:#ffb454;color:#0a0c11;font-weight:700}
button.go:hover{background:#ffc673}
.sw{width:22px;height:22px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:#e9eef4}
.status{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:10px;letter-spacing:.16em;color:#556474}
.status b{color:#ffb454}
.status.done b{color:#7fd7a8}
.v{color:#c9d6e4}
</style>
</head>
<body>
<h1>String Art Loom · chords of a word</h1>
<div class="frame" id="frame">
  <canvas id="art"></canvas>
  <canvas id="prev"></canvas>
</div>
<div class="bar">
  <input type="text" id="word" value="LOOM" maxlength="9" spellcheck="false">
  <label>PINS <input type="range" id="pinsR" min="80" max="240" step="4" value="160"><span class="v" id="pinsV">160</span></label>
  <label>LINES <input type="range" id="budR" min="400" max="3600" step="100" value="1800"><span class="v" id="budV">1800</span></label>
  <span class="sw on" data-c="#ffb454" style="background:#ffb454"></span>
  <span class="sw" data-c="#5fd0ff" style="background:#5fd0ff"></span>
  <span class="sw" data-c="#ff6fae" style="background:#ff6fae"></span>
  <span class="sw" data-c="#f2ede4" style="background:#f2ede4"></span>
  <input type="color" id="pick" value="#ffb454" title="custom thread colour">
  <button id="mode">MODE: LOOM</button>
  <button id="clear">CLEAR</button>
  <button id="go" class="go">WEAVE</button>
</div>
<div class="status" id="st"><span>WORD <b id="sw">LOOM</b></span><span>WOVEN <b id="sl">0</b></span><span>PROGRESS <b id="sp">0%</b></span><span id="sh">greedy chord solver · drag in DRAW mode</span></div>
<script>
(function(){
"use strict";
var GW=120;
var frame=document.getElementById("frame");
var art=document.getElementById("art"),ax=art.getContext("2d");
var prev=document.getElementById("prev"),px=prev.getContext("2d");
var wordEl=document.getElementById("word"),pinsR=document.getElementById("pinsR"),budR=document.getElementById("budR");
var pinsV=document.getElementById("pinsV"),budV=document.getElementById("budV");
var stEl=document.getElementById("st"),swEl=document.getElementById("sw"),slEl=document.getElementById("sl"),spEl=document.getElementById("sp"),shEl=document.getElementById("sh");
var W=520,N=160,budget=1800;
var thread="#ffb454",mode="loom",lines=[],pins=[];
var gen=null,token=0;
function rgba(hex,a){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return "rgba("+r+","+g+","+b+","+a+")";
}
function computePins(){
  pins=[];
  var R=W/2-14,cx=W/2;
  for(var i=0;i<N;i++){
    var ang=-Math.PI/2+2*Math.PI*i/N;
    pins.push([cx+R*Math.cos(ang),cx+R*Math.sin(ang)]);
  }
}
function bg(){
  ax.fillStyle="#0b0d12";ax.fillRect(0,0,W,W);
  var gr=ax.createRadialGradient(W/2,W/2,W*0.18,W/2,W/2,W*0.72);
  gr.addColorStop(0,"rgba(30,38,52,.55)");gr.addColorStop(1,"rgba(0,0,0,0)");
  ax.fillStyle=gr;ax.fillRect(0,0,W,W);
  ax.strokeStyle=rgba(thread,.14);ax.lineWidth=1;
  ax.beginPath();ax.arc(W/2,W/2,W/2-14,0,6.2832);ax.stroke();
  for(var i=0;i<pins.length;i++){
    ax.fillStyle=rgba(thread,i%10===0?.95:.55);
    ax.beginPath();ax.arc(pins[i][0],pins[i][1],i%10===0?2.6:1.7,0,6.2832);ax.fill();
  }
}
function drawLine(i,j){
  ax.strokeStyle=rgba(thread,.5);ax.lineWidth=.6;
  ax.beginPath();ax.moveTo(pins[i][0],pins[i][1]);ax.lineTo(pins[j][0],pins[j][1]);ax.stroke();
}
function redrawAll(){
  bg();
  for(var i=0;i<lines.length;i++)drawLine(lines[i][0],lines[i][1]);
}
function setSize(){
  W=Math.min(560,Math.max(300,Math.min(window.innerWidth-28,window.innerHeight-270)));
  art.width=W;art.height=W;prev.width=W;prev.height=W;
  frame.style.width=W+"px";
  computePins();redrawAll();
}
function buildTarget(txt){
  var off=document.createElement("canvas");off.width=GW;off.height=GW;
  var g=off.getContext("2d");
  g.fillStyle="#000";g.fillRect(0,0,GW,GW);
  var size=46;
  txt=txt.toUpperCase()||"ART";
  while(size>10){g.font="900 "+size+"px ui-monospace,Menlo,monospace";if(g.measureText(txt).width<=GW-14)break;size-=2;}
  g.font="900 "+size+"px ui-monospace,Menlo,monospace";
  while(txt.length>1&&g.measureText(txt).width>GW-14)txt=txt.slice(0,-1);
  g.textAlign="center";g.textBaseline="middle";
  g.fillStyle="#fff";g.fillText(txt,GW/2,GW/2+1);
  var d=g.getImageData(0,0,GW,GW).data;
  var t=new Uint8Array(GW*GW);
  for(var i=0;i<GW*GW;i++)if(d[i*4+3]>90)t[i]=1;
  return t;
}
function chord(i,j,apply){
  var x1=pins[i][0]/W*GW,y1=pins[i][1]/W*GW;
  var x2=pins[j][0]/W*GW,y2=pins[j][1]/W*GW;
  var dx=x2-x1,dy=y2-y1;
  var steps=Math.ceil(Math.sqrt(dx*dx+dy*dy)*1.3);
  var hit=0;
  for(var s=0;s<=steps;s++){
    var t=s/steps;
    var gx=(x1+dx*t)|0,gy=(y1+dy*t)|0;
    if(gx<0||gy<0||gx>=GW||gy>=GW)continue;
    var idx=gy*GW+gx;
    if(gen.target[idx]){hit++;if(apply)gen.target[idx]=0;}
  }
  return hit;
}
function genOne(){
  var cur=gen.cur,best=-1,bestScore=1;
  for(var p=0;p<N;p++){
    var d=(p-cur+N)%N;
    if(d<4||d>N-4)continue;
    var sc=chord(cur,p,false);
    if(sc>bestScore){bestScore=sc;best=p;}
  }
  if(best<0){
    gen.miss++;
    if(gen.miss>8){gen.done=true;return;}
    gen.cur=(gen.cur+9)%N;
    return;
  }
  gen.miss=0;
  chord(cur,best,true);
  lines.push([cur,best]);
  drawLine(cur,best);
  gen.cur=best;gen.made++;
  if(gen.made>=gen.budget)gen.done=true;
}
function tick(){
  if(!gen||gen.token!==token)return;
  var n=0;
  while(!gen.done&&n<26){genOne();n++;}
  slEl.textContent=gen.made;
  var pct=gen.done?100:Math.min(99,Math.floor(gen.made/gen.budget*100));
  spEl.textContent=pct+"%";
  if(gen.done){
    stEl.className="status done";
    shEl.textContent="COMPLETE · "+gen.made+" chords · "+N+" pins";
    gen=null;
    return;
  }
  requestAnimationFrame(tick);
}
function weave(){
  token++;gen=null;
  lines=[];
  setSize();
  var txt=(wordEl.value||"ART").trim().toUpperCase();
  swEl.textContent=txt;
  gen={target:buildTarget(txt),cur:0,made:0,miss:0,done:false,budget:budget,token:token};
  stEl.className="status";
  shEl.textContent="weaving…";
  slEl.textContent="0";spEl.textContent="0%";
  requestAnimationFrame(tick);
}
function nearest(x,y){
  var best=0,bd=1e9;
  for(var i=0;i<pins.length;i++){
    var dx=pins[i][0]-x,dy=pins[i][1]-y;
    var d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=i;}
  }
  return best;
}
var dragFrom=-1;
prev.style.pointerEvents="none";
function setMode(m){
  mode=m;
  document.getElementById("mode").textContent="MODE: "+(m==="loom"?"LOOM":"DRAW");
  prev.style.pointerEvents=m==="draw"?"auto":"none";
  prev.style.cursor=m==="draw"?"crosshair":"default";
  shEl.textContent=m==="draw"?"draw: press a pin, drag to another pin":"greedy chord solver · drag in DRAW mode";
}
prev.addEventListener("pointerdown",function(e){
  if(mode!=="draw")return;
  var r=prev.getBoundingClientRect();
  dragFrom=nearest(e.clientX-r.left,e.clientY-r.top);
  if(prev.setPointerCapture)prev.setPointerCapture(e.pointerId);
});
prev.addEventListener("pointermove",function(e){
  if(dragFrom<0)return;
  var r=prev.getBoundingClientRect();
  var x=e.clientX-r.left,y=e.clientY-r.top;
  px.clearRect(0,0,W,W);
  px.strokeStyle=rgba(thread,.9);px.lineWidth=1.2;
  px.beginPath();px.moveTo(pins[dragFrom][0],pins[dragFrom][1]);px.lineTo(x,y);px.stroke();
  px.fillStyle=rgba(thread,1);
  px.beginPath();px.arc(pins[dragFrom][0],pins[dragFrom][1],4,0,6.2832);px.fill();
});
prev.addEventListener("pointerup",function(e){
  if(dragFrom<0)return;
  var r=prev.getBoundingClientRect();
  var to=nearest(e.clientX-r.left,e.clientY-r.top);
  px.clearRect(0,0,W,W);
  if(to!==dragFrom){
    var d=(to-dragFrom+N)%N;
    if(d>=4&&d<=N-4){
      lines.push([dragFrom,to]);
      drawLine(dragFrom,to);
      slEl.textContent=lines.length;
    }
  }
  dragFrom=-1;
});
pinsR.addEventListener("input",function(){
  N=Number(this.value);pinsV.textContent=N;
  computePins();redrawAll();
  if(gen)gen.done=true;
});
budR.addEventListener("input",function(){
  budget=Number(this.value);budV.textContent=budget;
});
document.querySelectorAll(".sw").forEach(function(s){
  s.addEventListener("click",function(){
    document.querySelectorAll(".sw").forEach(function(o){o.className="sw";});
    s.className="sw on";
    thread=s.getAttribute("data-c");
    document.getElementById("pick").value=thread;
    redrawAll();
  });
});
document.getElementById("pick").addEventListener("input",function(){
  thread=this.value;
  document.querySelectorAll(".sw").forEach(function(o){o.className="sw";});
  redrawAll();
});
document.getElementById("go").addEventListener("click",weave);
document.getElementById("mode").addEventListener("click",function(){
  setMode(mode==="loom"?"draw":"loom");
});
document.getElementById("clear").addEventListener("click",function(){
  token++;gen=null;lines=[];
  px.clearRect(0,0,W,W);
  redrawAll();
  slEl.textContent="0";spEl.textContent="0%";
  shEl.textContent="cleared · press WEAVE";
});
wordEl.addEventListener("keydown",function(e){if(e.key==="Enter")weave();});
var rzT=0;
window.addEventListener("resize",function(){
  clearTimeout(rzT);
  rzT=setTimeout(function(){setSize();if(gen){gen.done=true;gen=null;shEl.textContent="resized · press WEAVE";}},160);
});
setSize();
weave();
})();
</script>
</body>
</html>
