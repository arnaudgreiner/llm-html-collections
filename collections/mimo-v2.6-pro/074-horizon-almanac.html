<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horizon Almanac — A Day Scrubbed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0c0d12;color:#c8c4bb;font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 14px}
h1{font-size:12px;letter-spacing:.4em;color:#ffd9a0;text-transform:uppercase}
h1 i{font-style:normal;color:#8fd0ff}
#scene{position:relative;width:100%;max-width:1060px;height:420px;border-radius:14px;overflow:hidden;border:1px solid #23262e;box-shadow:0 26px 60px rgba(0,0,0,.55)}
canvas{display:block;width:100%;height:100%}
#clock{position:absolute;top:16px;left:20px;font-size:34px;letter-spacing:.12em;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
#clock span{display:block;font-size:10px;letter-spacing:.34em;color:rgba(255,255,255,.75);margin-top:4px}
#phase{position:absolute;top:20px;right:22px;font-size:10px;letter-spacing:.3em;color:rgba(255,255,255,.85);text-align:right;line-height:2}
#phase b{color:#ffd9a0}
#scrub{width:100%;max-width:1060px;background:#14161c;border:1px solid #23262e;border-radius:12px;padding:14px 18px}
.track{position:relative;height:64px;margin-bottom:6px}
#slots{position:absolute;inset:0 0 26px 0;display:flex}
#slots div{flex:1;position:relative;border-right:1px dashed rgba(255,255,255,.10);cursor:pointer}
#slots div:last-child{border-right:0}
#slots div span{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:8.5px;letter-spacing:.14em;color:#5d6470;white-space:nowrap;cursor:pointer}
#slots div:hover span{color:#ffd9a0}
#rail{position:absolute;left:0;right:0;bottom:20px;height:3px;background:#23262e;border-radius:3px}
#rail i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#3d6ba8,#ffd9a0,#e07a4f,#3d6ba8);border-radius:3px}
#handle{position:absolute;bottom:14px;width:3px;height:34px;background:#fff;border-radius:2px;box-shadow:0 0 12px rgba(255,255,255,.8);pointer-events:none}
#handle::after{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{background:#1b1e26;border:1px solid #2c313c;color:#c8c4bb;font:inherit;font-size:10px;padding:8px 13px;border-radius:7px;cursor:pointer;letter-spacing:.14em;transition:.15s}
button:hover{border-color:#ffd9a0;color:#ffe8c8}
button.on{background:#ffd9a0;border-color:#ffd9a0;color:#17130a;font-weight:700}
.tog{display:flex;align-items:center;gap:7px;font-size:9.5px;letter-spacing:.16em;color:#6d7382;cursor:pointer}
.tog i{width:30px;height:16px;border-radius:9px;background:#23262e;position:relative;transition:.2s}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#6d7382;transition:.2s}
.tog.on i{background:#3d6ba8}
.tog.on i::after{left:16px;background:#fff}
.meta{font-size:9.5px;letter-spacing:.16em;color:#565c69;margin-left:auto}
.meta b{color:#ffd9a0}
.hint{font-size:9.5px;letter-spacing:.14em;color:#454a56;text-align:center;max-width:900px;line-height:1.9}
</style>
</head>
<body>
<h1>Horizon Almanac <i>M74</i> · one day scrubbed</h1>
<div id="scene">
  <canvas id="cv" width="1060" height="420"></canvas>
  <div id="clock">06:00<span id="dateLine">EQUINOX · DAY 268</span></div>
  <div id="phase">SKY PHASE<br><b id="phName">DAWN</b></div>
</div>
<div id="scrub">
  <div class="track">
    <div id="slots"></div>
    <div id="rail"><i id="fill"></i></div>
    <div id="handle"></div>
  </div>
  <div class="row">
    <button id="bPlay">▶ PLAY DAY</button>
    <button data-j="360">NOON</button>
    <button data-j="1140">SUNSET</button>
    <button data-j="1380">MIDNIGHT</button>
    <div class="tog on" id="tStars"><i></i>STARS</div>
    <div class="tog" id="tLamp"><i></i>LAMPS</div>
    <div class="meta">solar altitude <b id="mAlt">+0°</b> · azimuth <b id="mAz">E</b> · cloud <b id="mCl">12%</b></div>
  </div>
</div>
<div class="hint">drag the handle across the rail (or click a labelled hour) to scrub time · play runs the whole day at 120× · city lamps wake after dusk under the stars</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ax=cv.getContext("2d");
var W=1060,H=420;
var J=360,playing=false,tStars=true,tLamp=false;
var stars=[];
for(var i=0;i<180;i++)stars.push({x:Math.random(),y:Math.random()*0.62,r:Math.random()*1.4+0.3,p:Math.random()*6.28});
var skyline=[];
(function(){
  var x=0;
  while(x<W){
    var w=30+Math.random()*70;
    var h=40+Math.random()*120;
    if(Math.random()<0.08)h=170+Math.random()*70;
    var win=[];
    for(var wy=10;wy<h-8;wy+=13)for(var wx=6;wx<w-8;wx+=11)win.push([wx,wy,Math.random()<0.55]);
    skyline.push({x:x,w:w,h:h,win:win,lampSeed:Math.random()});
    x+=w+(Math.random()<0.4?8:0);
  }
})();
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function hsl(h,s,l,a){return "hsla("+h+","+s+"%,"+l+"%,"+(a===undefined?1:a)+")";}
function skyState(j){
  var h=j/60;
  var day=clamp((h-6)/6,0,1);
  var night=clamp((6-h)/3,0,1)+(clamp((h-19)/3,0,1));
  night=clamp(night,0,1);
  var sunset=Math.max(clamp(1-Math.abs(h-18.7)/1.6,0,1),clamp(1-Math.abs(h-6.2)/1.4,0,1));
  return {day:day,night:night,sunset:sunset,h:h};
}
function skyGradient(s){
  var g=ax.createLinearGradient(0,0,0,H);
  var top=[hsl(215+20*s.sunset,45,8+46*s.day),hsl(210+30*s.sunset,50,10+44*s.day),hsl(26,70,10+50*s.sunset)];
  var midC=s.sunset>0.25?hsl(26+ (1-s.sunset)*160,60,16+46*s.sunset):hsl(214,52,10+44*s.day);
  var botC=s.sunset>0.25?hsl(14+ (1-s.sunset)*30,75,20+48*s.sunset):hsl(214,46,14+44*s.day);
  g.addColorStop(0,s.night>0.7?hsl(222,50,6+10*(1-s.night)):hsl(216,45,14+40*s.day));
  g.addColorStop(0.55,midC);
  g.addColorStop(1,botC);
  return g;
}
function drawScene(){
  var s=skyState(J);
  ax.fillStyle=skyGradient(s);
  ax.fillRect(0,0,W,H);
  if(tStars&&s.night>0.05){
    stars.forEach(function(st){
      var tw=0.55+0.45*Math.sin(perfT*1.6+st.p);
      ax.fillStyle="rgba(255,255,255,"+(s.night*tw).toFixed(3)+")";
      ax.beginPath();ax.arc(st.x*W,st.y*H,st.r,0,6.2832);ax.fill();
    });
    ax.fillStyle="rgba(255,250,225,"+(s.night*0.9).toFixed(2)+")";
    ax.beginPath();ax.arc(W*0.8,H*0.16,15,0,6.2832);ax.fill();
    ax.fillStyle=skyGradient(s);
    ax.beginPath();ax.arc(W*0.8-7,H*0.16-5,13,0,6.2832);ax.fill();
  }
  var ang=(s.h-6)/12*Math.PI;
  var sx=W*0.5+Math.cos(ang)*W*0.46;
  var sy=H*0.92-Math.sin(ang)*H*0.78;
  if(s.night<0.85){
    var sunA=1-s.night;
    if(s.sunset>0.15){
      ax.fillStyle="rgba(255,"+Math.round(160+70*(1-s.sunset))+",90,"+sunA+")";
      ax.shadowColor="rgba(255,140,60,.9)";ax.shadowBlur=46;
    }else{
      ax.fillStyle="rgba(255,246,214,"+sunA+")";
      ax.shadowColor="rgba(255,240,190,.9)";ax.shadowBlur=34;
    }
    ax.beginPath();ax.arc(sx,sy,24,0,6.2832);ax.fill();
    ax.shadowBlur=0;
  }
  if(s.night>0.25){
    var ma=ang+Math.PI;
    var mx=W*0.5+Math.cos(ma)*W*0.44;
    var my=H*0.92-Math.sin(ma)*H*0.74;
    ax.fillStyle="rgba(232,238,255,"+s.night+")";
    ax.shadowColor="rgba(200,215,255,.8)";ax.shadowBlur=22;
    ax.beginPath();ax.arc(mx,my,17,0,6.2832);ax.fill();
    ax.shadowBlur=0;
    ax.fillStyle="rgba(140,155,190,"+(s.night*0.5)+")";
    ax.beginPath();ax.arc(mx+6,my-4,4,0,6.2832);ax.fill();
    ax.beginPath();ax.arc(mx-5,my+6,3,0,6.2832);ax.fill();
  }
  var groundTop=H*0.78;
  var glowG=ax.createLinearGradient(0,groundTop-60,0,groundTop);
  glowG.addColorStop(0,"rgba(0,0,0,0)");
  glowG.addColorStop(1,"rgba(255,"+Math.round(140+90*s.sunset)+","+(60+40*s.sunset)+","+(0.25*s.sunset+0.06*s.day)+")");
  ax.fillStyle=glowG;ax.fillRect(0,groundTop-60,W,60);
  skyline.forEach(function(b){
    var bx=b.x,by=groundTop-b.h;
    var lit=tLamp&&s.night>0.3;
    ax.fillStyle=s.night>0.5?"#0d0f16":hsl(216,14,16+10*s.day);
    ax.fillRect(bx,by,b.w,b.h);
    ax.fillStyle=s.night>0.5?"#141824":hsl(216,16,22+14*s.day);
    ax.fillRect(bx,by,b.w,4);
    b.win.forEach(function(w,i){
      var warm=(b.lampSeed*7+i*0.37)%1;
      var on=lit&&w[2]&&(s.night>0.35+warm*0.5);
      if(on){
        ax.fillStyle=warm>0.5?"rgba(255,214,140,.95)":"rgba(180,214,255,.9)";
        ax.shadowColor="rgba(255,205,130,.8)";ax.shadowBlur=7;
      }else{
        ax.fillStyle=s.night>0.5?"rgba(40,48,66,.6)":"rgba(120,150,190,.35)";
        ax.shadowBlur=0;
      }
      ax.fillRect(bx+w[0],by+w[1],6,7);
      ax.shadowBlur=0;
    });
  });
  ax.fillStyle=s.night>0.5?"#08090d":hsl(216,12,10+8*s.day);
  ax.fillRect(0,groundTop,W,H-groundTop);
  ax.fillStyle="rgba(255,255,255,.05)";
  for(var y=groundTop+8;y<H;y+=12)ax.fillRect(0,y,W,1);
  for(var i=0;i<6;i++){
    var lx=W*(i+0.5)/6;
    ax.strokeStyle="#161a24";ax.lineWidth=3;
    ax.beginPath();ax.moveTo(lx,groundTop);ax.lineTo(lx,groundTop-46);ax.stroke();
    var lampOn=tLamp&&s.night>0.3;
    ax.fillStyle=lampOn?"#ffd9a0":"#2a2f3c";
    if(lampOn){ax.shadowColor="rgba(255,210,150,.9)";ax.shadowBlur=16;}
    ax.beginPath();ax.arc(lx,groundTop-50,5,0,6.2832);ax.fill();
    ax.shadowBlur=0;
    if(lampOn){
      var lg=ax.createLinearGradient(lx,groundTop-46,lx,groundTop);
      lg.addColorStop(0,"rgba(255,210,150,.28)");lg.addColorStop(1,"rgba(255,210,150,0)");
      ax.fillStyle=lg;
      ax.beginPath();ax.moveTo(lx-4,groundTop-46);ax.lineTo(lx+4,groundTop-46);ax.lineTo(lx+26,groundTop);ax.lineTo(lx-26,groundTop);ax.fill();
    }
  }
}
function phaseName(){
  var h=J/60;
  if(h<5)return "DEEP NIGHT";
  if(h<7)return "DAWN";
  if(h<11)return "MORNING";
  if(h<14)return "ZENITH";
  if(h<17.5)return "AFTERNOON";
  if(h<19.5)return "GOLDEN HOUR";
  if(h<21)return "DUSK";
  return "NIGHT";
}
var slots=document.getElementById("slots");
var LABELS=[[0,"00"],[180,"03"],[360,"06"],[540,"09"],[720,"12"],[900,"15"],[1080,"18"],[1260,"21"]];
LABELS.forEach(function(L){
  var d=document.createElement("div");
  d.innerHTML="<span>"+L[1]+":00</span>";
  d.addEventListener("click",function(){J=L[0];playing=false;bPlay.className="";bPlay.textContent="▶ PLAY DAY";});
  slots.appendChild(d);
});
function readouts(){
  var hh=Math.floor(J/60),mm=Math.floor(J%60);
  document.getElementById("clock").childNodes[0].nodeValue=("0"+hh).slice(-2)+":"+("0"+mm).slice(-2);
  document.getElementById("phName").textContent=phaseName();
  var s=skyState(J);
  var alt=Math.round(Math.sin((s.h-6)/12*Math.PI)*66);
  var dirs=["E","SE","S","SW","W","NW","N","NE"];
  document.getElementById("mAlt").textContent=(alt>=0?"+":"")+alt+"°";
  document.getElementById("mAz").textContent=dirs[Math.floor(((s.h-6)/12*8+8)%8)];
  document.getElementById("mCl").textContent=(8+Math.round(14*(1+Math.sin(J/140))))+"%";
  document.getElementById("fill").style.width=(J/1440*100)+"%";
  document.getElementById("handle").style.left=(J/1440*100)+"%";
}
var track=document.querySelector(".track");
var dragging=false;
function scrubAt(clientX){
  var r=track.getBoundingClientRect();
  J=clamp(Math.round((clientX-r.left)/r.width*1440),0,1439);
}
track.addEventListener("pointerdown",function(e){
  dragging=true;playing=false;bPlay.className="";bPlay.textContent="▶ PLAY DAY";
  track.setPointerCapture(e.pointerId);scrubAt(e.clientX);
});
track.addEventListener("pointermove",function(e){if(dragging)scrubAt(e.clientX);});
track.addEventListener("pointerup",function(){dragging=false;});
track.addEventListener("pointercancel",function(){dragging=false;});
var bPlay=document.getElementById("bPlay");
bPlay.addEventListener("click",function(){
  playing=!playing;
  this.className=playing?"on":"";
  this.textContent=playing?"❚❚ PAUSE":"▶ PLAY DAY";
});
document.querySelectorAll("[data-j]").forEach(function(b){
  b.addEventListener("click",function(){J=Number(b.getAttribute("data-j"))%1440;});
});
document.getElementById("tStars").addEventListener("click",function(){
  tStars=!tStars;this.className=tStars?"tog on":"tog";
});
document.getElementById("tLamp").addEventListener("click",function(){
  tLamp=!tLamp;this.className=tLamp?"tog on":"tog";
});
var perfT=0,last=performance.now();
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  perfT+=dt;
  if(playing){J=(J+dt*120)%1440;}
  drawScene();
  readouts();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
