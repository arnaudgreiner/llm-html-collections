<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metaball Garden</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#080d12;color:#cfe;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
canvas{display:block;cursor:crosshair}
#bar{position:fixed;left:16px;top:16px;width:236px;background:rgba(6,13,18,.82);border:1px solid #1d3d4a;border-radius:12px;padding:13px 15px}
h1{font-size:12px;letter-spacing:.26em;color:#6fe3d2;text-transform:uppercase;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;font-size:11px;margin:9px 0;color:#8fb2bd}
.row label{width:66px}
input[type=range]{flex:1;accent-color:#57e0c8}
.btns{display:flex;gap:7px;margin-top:11px}
button{flex:1;background:#11242c;border:1px solid #2c5c69;color:#aef;font:inherit;font-size:11px;padding:6px 4px;border-radius:7px;cursor:pointer}
button:hover{background:#1c3b48}
#read{position:fixed;right:16px;top:16px;background:rgba(6,13,18,.82);border:1px solid #1d3d4a;border-radius:12px;padding:11px 14px;font-size:11px;line-height:1.7;color:#79a7b4;text-align:right}
#read b{color:#ffd27f;font-weight:600}
#hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.16em;color:#4e7583;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar">
  <h1>Field Console</h1>
  <div class="row"><label>blobs</label><input id="count" type="range" min="4" max="24" value="12"><span id="countV">12</span></div>
  <div class="row"><label>threshold</label><input id="iso" type="range" min="40" max="220" value="100"><span id="isoV">1.0</span></div>
  <div class="row"><label>drift</label><input id="speed" type="range" min="0" max="100" value="45"><span id="speedV">45</span></div>
  <div class="btns">
    <button id="reseed">reseed</button>
    <button id="freeze">freeze</button>
  </div>
</div>
<div id="read">blobs <b id="rBlobs">12</b><br>contour cells <b id="rCells">0</b><br>frame <b id="rMs">0.0</b> ms</div>
<div id="hint">move to stir the field — click to plant a blob</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0,dpr=1;
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  cv.style.width=W+"px";cv.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);resize();
var blobs=[],iso=1.0,drift=1,seededW=0,seededH=0,frozen=false;
var mouse={x:-9999,y:-9999,on:false};
function seed(n){
  blobs=[];
  for(var i=0;i<n;i++){
    blobs.push({x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*1.6,vy:(Math.random()-.5)*1.6,
      r:55+Math.random()*65,ph:Math.random()*6.283});
  }
  seededW=W;seededH=H;
}
seed(12);
var countS=document.getElementById("count"),isoS=document.getElementById("iso"),speedS=document.getElementById("speed");
var countV=document.getElementById("countV"),isoV=document.getElementById("isoV"),speedV=document.getElementById("speedV");
var rBlobs=document.getElementById("rBlobs"),rCells=document.getElementById("rCells"),rMs=document.getElementById("rMs");
countS.addEventListener("input",function(){
  var n=+countS.value;countV.textContent=n;
  while(blobs.length<n)blobs.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*1.6,vy:(Math.random()-.5)*1.6,r:55+Math.random()*65,ph:Math.random()*6.283});
  while(blobs.length>n)blobs.pop();
});
isoS.addEventListener("input",function(){iso=(+isoS.value)/100;isoV.textContent=iso.toFixed(1);});
speedS.addEventListener("input",function(){drift=(+speedS.value)/45;speedV.textContent=speedS.value;});
document.getElementById("reseed").addEventListener("click",function(){seed(+countS.value);});
document.getElementById("freeze").addEventListener("click",function(){
  frozen=!frozen;this.textContent=frozen?"drift":"freeze";
});
cv.addEventListener("pointermove",function(e){mouse.x=e.clientX;mouse.y=e.clientY;mouse.on=true;});
cv.addEventListener("pointerleave",function(){mouse.on=false;});
cv.addEventListener("pointerdown",function(e){
  var r=cv.getBoundingClientRect();
  blobs.push({x:e.clientX-r.left,y:e.clientY-r.top,
    vx:(Math.random()-.5)*1.6,vy:(Math.random()-.5)*1.6,
    r:55+Math.random()*65,ph:Math.random()*6.283});
  countS.value=Math.min(24,blobs.length);countV.textContent=blobs.length;
  countS.dispatchEvent(new Event("input",{bubbles:false}),"input");
  if(blobs.length>+countS.value){/* slider clamps back down next input */}
});
var STEP=9;
var TAB=[[],[[3,0]],[[0,1]],[[3,1]],[[1,2]],[[3,0],[1,2]],[[0,2]],[[3,2]],
             [[2,3]],[[0,2]],[[0,1],[2,3]],[[1,2]],[[1,3]],[[0,1]],[[3,0]],[]];
function edgePt(e,i,j,x,y,a,b,c,d){
  var t;
  if(e===0){t=(iso-a)/(b-a||1e-6);return[x+t*STEP,y];}
  if(e===1){t=(iso-b)/(c-b||1e-6);return[x+STEP,y+t*STEP];}
  if(e===2){t=(iso-d)/(c-d||1e-6);return[x+t*STEP,y+STEP];}
  t=(iso-a)/(d-a||1e-6);return[x,y+t*STEP];
}
var last=0,msAvg=0;
function frame(now){
  var t0=performance.now();
  var dt=Math.min(50,now-last||16);last=now;
  if(!frozen&&drift>0){
    for(var k=0;k<blobs.length;k++){
      var b=blobs[k];
      b.x+=b.vx*drift*dt/16;b.y+=b.vy*drift*dt/16;
      if(b.x<b.r*.4){b.x=b.r*.4;b.vx=Math.abs(b.vx);}
      if(b.x>W-b.r*.4){b.x=W-b.r*.4;b.vx=-Math.abs(b.vx);}
      if(b.y<b.r*.4){b.y=b.r*.4;b.vy=Math.abs(b.vy);}
      if(b.y>H-b.r*.4){b.y=H-b.r*.4;b.vy=-Math.abs(b.vy);}
      b.ph+=dt/900;
    }
  }
  ctx.fillStyle="#080d12";ctx.fillRect(0,0,W,H);
  var cols=Math.ceil(W/STEP)+2,rows=Math.ceil(H/STEP)+2;
  var v=new Float32Array(cols*rows);
  var n=blobs.length,extraR=mouse.on?95:0;
  for(var j=0;j<rows;j++){
    var y=j*STEP;
    for(var i=0;i<cols;i++){
      var x=i*STEP,s=0;
      for(var q=0;q<n;q++){
        var bb=blobs[q],dx=x-bb.x,dy=y-bb.y;
        s+=(bb.r*bb.r)/(dx*dx+dy*dy+200);
      }
      if(mouse.on){var mx=x-mouse.x,my=y-mouse.y;s+=(extraR*extraR)/(mx*mx+my*my+200);}
      v[j*cols+i]=s;
    }
  }
  var segCount=0;
  ctx.beginPath();
  for(var jj=0;jj<rows-1;jj++){
    for(var ii=0;ii<cols-1;ii++){
      var a0=v[jj*cols+ii],b0=v[jj*cols+ii+1],c0=v[(jj+1)*cols+ii+1],d0=v[(jj+1)*cols+ii];
      var idx=(a0>iso?1:0)|(b0>iso?2:0)|(c0>iso?4:0)|(d0>iso?8:0);
      var tab=TAB[idx];if(!tab.length)continue;
      var px=ii*STEP,py=jj*STEP;
      for(var sgi=0;sgi<tab.length;sgi++){
        var p1=edgePt(tab[sgi][0],ii,jj,px,py,a0,b0,c0,d0);
        var p2=edgePt(tab[sgi][1],ii,jj,px,py,a0,b0,c0,d0);
        ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);segCount++;
      }
    }
  }
  var g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,"#3ce0c4");g.addColorStop(.5,"#5aa9ff");g.addColorStop(1,"#c46bff");
  ctx.lineCap="round";ctx.lineWidth=4.5;ctx.strokeStyle=g;ctx.globalAlpha=.55;ctx.stroke();
  ctx.lineWidth=1.4;ctx.globalAlpha=.95;ctx.strokeStyle="#d9fff8";ctx.stroke();
  ctx.globalAlpha=1;
  var ms=performance.now()-t0;
  msAvg=msAvg*.92+ms*.08;
  if((now/250|0)!==((now-dt)/250|0)){
    rBlobs.textContent=blobs.length;
    rCells.textContent=segCount;
    rMs.textContent=msAvg.toFixed(1);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
