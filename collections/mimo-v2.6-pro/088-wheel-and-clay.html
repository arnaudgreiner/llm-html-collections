<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wheel & Clay — Thrown Vessel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#1c1712;color:#cbbfae;font-family:Georgia,'Times New Roman',serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 14px}
h1{font-size:15px;letter-spacing:.3em;color:#e0a86b;text-transform:uppercase}
h1 i{font-style:normal;color:#7fae9a}
#bench{background:#241d16;border:1px solid #3b3025;border-radius:14px;padding:16px}
canvas{display:block;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.55);cursor:ns-resize;touch-action:none}
.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;justify-content:center;max-width:720px}
button{background:#2a221a;border:1px solid #4a3c2c;color:#d7c9b6;font:inherit;font-size:9.5px;padding:8px 12px;border-radius:7px;cursor:pointer;letter-spacing:.14em;transition:.15s}
button:hover{border-color:#e0a86b;color:#fff4e4}
button.on{background:#e0a86b;border-color:#e0a86b;color:#241703;font-weight:700}
select{background:#2a221a;border:1px solid #4a3c2c;color:#d7c9b6;font:inherit;font-size:9.5px;padding:7px 9px;border-radius:7px}
.stat{font-size:9.5px;letter-spacing:.14em;color:#8a7c6a}
.stat b{color:#e0a86b}
.hint{font-size:9.5px;letter-spacing:.13em;color:#6b6053;text-align:center;max-width:700px;line-height:1.9}
</style>
</head>
<body>
<h1>Wheel &amp; Clay <i>M88</i> · thrown vessel</h1>
<div id="bench"><canvas id="cv" width="720" height="540"></canvas></div>
<div class="bar">
  <select id="tool">
    <option value="pull">DRAG: PULL OUT</option>
    <option value="push">DRAG: COLLAPSE</option>
    <option value="slam">DRAG: SLAM DOWN</option>
  </select>
  <button id="bCenter">⌖ CENTER IT</button>
  <button id="bBowl">◡ BOWL SHAPE</button>
  <button id="bNeck">ℓ NECK SHAPE</button>
  <select id="glaze">
    <option value="terracotta">GLAZE: TERRACOTTA</option>
    <option value="celadon">GLAZE: CELADON</option>
    <option value="cobalt">GLAZE: COBALT</option>
    <option value="bone">GLAZE: BONE CHINA</option>
    <option value="raw">RAW CLAY</option>
  </select>
  <button id="bFire">🔥 FIRE IT</button>
  <span class="stat">height <b id="mH">0</b> cm · width <b id="mW">0</b> cm · volume <b id="mV">0</b> ml · <b id="mS">wet</b></span>
</div>
<div class="hint">drag vertically on the spinning pot to raise, widen or slam its wall · every gesture is honest to the profile beneath it · shapes come out different every time the wheel starts</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ax=cv.getContext("2d");
var W=720,H=540,CX=W/2,BASE=H-92;
var RINGS=46;
var prof=[];            // radius by ring index (bottom→top), px
var state="wet";        // wet | fired
var glaze="terracotta";
var wheelPhase=0;
var GLZ={
  terracotta:{base:"#c4663b",hi:"#efa276",shade:"#7e3c1e"},
  celadon:{base:"#9dc3a8",hi:"#d4efe0",shade:"#5a8570"},
  cobalt:{base:"#4266b0",hi:"#87a6e2",shade:"#22366b"},
  bone:{base:"#e9e3d4",hi:"#ffffff",shade:"#a79f8c"},
  raw:{base:"#9a8d7b",hi:"#c2b7a5",shade:"#5f564a"}
};
function newForm(){
  prof=[];
  for(var i=0;i<RINGS;i++)prof.push(0);
  var H0=26+Math.floor(Math.random()*20);            // start at random height
  var belly=0.55+Math.random()*0.5, lip=0.4+Math.random()*0.9;
  for(var i2=0;i2<H0;i2++)grow(i2,H0,belly,lip);
  state="wet";
}
function grow(i,H0,belly,lip){
  var f=i/(H0-1||1);
  var r=40+62*Math.sin(Math.PI*Math.pow(f,belly))+26*f*lip;
  prof[i]=Math.max(20,Math.min(160,r));
}
function centerAll(){for(var i=0;i<RINGS;i++)prof[i]*=0.82;}
function bowlShape(){
  for(var i=0;i<RINGS;i++){
    var f=i/(RINGS-1);
    if(prof[i]>1)prof[i]=35+115*Math.sin(Math.PI*Math.pow(f,0.7));
  }
}
function neckShape(){
  for(var i=0;i<RINGS;i++){
    var f=i/(RINGS-1);
    if(prof[i]>1)prof[i]=52+80*Math.sin(Math.PI*f)-54*Math.pow(f,3)+30*Math.pow(Math.max(0,f-0.75)*4,2)*f;
  }
}
document.getElementById("bCenter").addEventListener("click",centerAll);
document.getElementById("bBowl").addEventListener("click",bowlShape);
document.getElementById("bNeck").addEventListener("click",neckShape);
document.getElementById("glaze").addEventListener("change",function(){glaze=this.value;});
document.getElementById("bFire").addEventListener("click",function(){
  if(state==="wet"){state="fired";this.className="on";}
  else{state="wet";this.className="";}
});
var topRing=0;
function heightOf(){var h=0;for(var i=0;i<RINGS;i++)if(prof[i]>1)h=i;return h;}
function metrics(){
  var top=heightOf();topRing=top;
  var w=0;for(var i=0;i<=top;i++)if(prof[i]>w)w=prof[i];
  var cmH=(top*1.05).toFixed(0),cmW=(w/26).toFixed(0);
  var ml=0;
  for(var i2=1;i2<=top;i2++){
    var r=prof[i2]/26;
    ml+=Math.PI*r*r*1.05;
  }
  document.getElementById("mH").textContent=cmH;
  document.getElementById("mW").textContent=cmW;
  document.getElementById("mV").textContent=Math.round(ml);
  document.getElementById("mS").textContent=state;
}
function ringY(i){return BASE-i*10;}
// pointer
var drag=false,dragY=0,dragX=0;
function nearRing(py){return Math.round((BASE-py)/10);}
cv.addEventListener("pointerdown",function(e){
  drag=true;cv.setPointerCapture(e.pointerId);
  dragY=(e.clientY-cv.getBoundingClientRect().top)*(H/cv.getBoundingClientRect().height);
  dragX=e.clientX;
});
cv.addEventListener("pointermove",function(e){
  if(!drag)return;
  var r=cv.getBoundingClientRect();
  var py=(e.clientY-r.top)*(H/r.height);
  var tool=document.getElementById("tool").value;
  var ring=Math.round((BASE-py)/10);
  if(ring<0||ring>=RINGS)return;
  if(prof[ring]<=1)return;
  if(tool==="pull")prof[ring]=Math.min(175,prof[ring]+1.6);
  else if(tool==="push")prof[ring]=Math.max(14,prof[ring]-1.6);
  else{
    // slam: push material down into ring below
    var amt=Math.min(prof[ring]*0.05,3);
    prof[ring]-=amt;
    if(ring>0&&prof[ring-1]>1)prof[ring-1]=Math.min(175,prof[ring-1]+amt*0.6);
  }
});
cv.addEventListener("pointerup",function(){drag=false;});
cv.addEventListener("pointercancel",function(){drag=false;});
function drawWheel(){
  // floor
  ax.fillStyle="#171310";ax.fillRect(0,0,W,H);
  // wheel head
  var wy=BASE+6;
  ax.fillStyle="#3a3229";
  ax.beginPath();ax.ellipse(CX,wy+26,220,42,0,0,6.2832);ax.fill();
  ax.fillStyle="#2c2620";
  ax.beginPath();ax.ellipse(CX,wy+14,220,42,0,0,6.2832);ax.fill();
  // spinning concentric marks
  ax.save();
  ax.translate(CX,wy+14);ax.scale(1,0.19);
  ax.strokeStyle="rgba(224,168,107,.35)";ax.lineWidth=3;
  for(var g=0;g<6;g++){
    ax.beginPath();
    ax.arc(0,0,60+g*26,wheelPhase+g*0.9,wheelPhase+g*0.9+2.6);
    ax.stroke();
  }
  ax.strokeStyle="rgba(255,255,255,.12)";ax.lineWidth=1.5;
  ax.beginPath();ax.arc(0,0,40,0,6.2832);ax.stroke();
  ax.restore();
}
function drawVessel(){
  var top=heightOf();
  if(top<1)return;
  var g=GLZ[glaze];
  var shrink=state==="fired"?0.92:1;
  // silhouette
  ax.beginPath();
  ax.moveTo(CX-prof[0]*shrink,ringY(0));
  for(var i=1;i<=top;i++)ax.lineTo(CX-prof[i]*shrink,ringY(i));
  for(var j=top;j>=0;j--)ax.lineTo(CX+prof[j]*shrink,ringY(j));
  ax.closePath();
  var grad=ax.createLinearGradient(CX-170,0,CX+170,0);
  grad.addColorStop(0,g.shade);grad.addColorStop(0.32,g.base);
  grad.addColorStop(0.46,g.hi);grad.addColorStop(0.62,g.base);
  grad.addColorStop(1,g.shade);
  ax.fillStyle=grad;ax.fill();
  ax.strokeStyle="rgba(0,0,0,.45)";ax.lineWidth=2;ax.stroke();
  // ring ridges from the thrower's fingers
  ax.strokeStyle="rgba(0,0,0,.16)";ax.lineWidth=1;
  for(var k=1;k<=top;k+=2){
    ax.beginPath();
    ax.moveTo(CX-prof[k]*shrink,ringY(k));
    ax.lineTo(CX+prof[k]*shrink,ringY(k));
    ax.stroke();
  }
  // rim opening
  var rt=prof[top]*shrink;
  ax.fillStyle="rgba(0,0,0,.55)";
  ax.beginPath();ax.ellipse(CX,ringY(top),rt,rt*0.26,0,0,6.2832);ax.fill();
  ax.strokeStyle=g.hi;ax.lineWidth=3;
  ax.beginPath();ax.ellipse(CX,ringY(top),rt,rt*0.26,0,0,6.2832);ax.stroke();
  // foot shadow
  ax.fillStyle="rgba(0,0,0,.4)";
  ax.beginPath();ax.ellipse(CX,ringY(0)+4,prof[0]*shrink,8,0,0,6.2832);ax.fill();
  // wet sheen while spinning (a vertical highlight on the left third)
  if(state==="wet"){
    ax.fillStyle="rgba(255,255,255,.10)";
    ax.beginPath();
    ax.moveTo(CX-prof[0]*shrink*0.55,ringY(0));
    for(var s=1;s<=top;s++)ax.lineTo(CX-prof[s]*shrink*0.55,ringY(s));
    for(var s2=top;s2>=0;s2--)ax.lineTo(CX-prof[s2]*shrink*0.30,ringY(s2));
    ax.closePath();ax.fill();
  }else{
    ax.fillStyle="rgba(255,255,255,.06)";
    ax.beginPath();
    ax.moveTo(CX-prof[0]*shrink*0.42,ringY(0));
    for(var s3=1;s3<=top;s3++)ax.lineTo(CX-prof[s3]*shrink*0.42,ringY(s3));
    for(var s4=top;s4>=0;s4--)ax.lineTo(CX-prof[s4]*shrink*0.24,ringY(s4));
    ax.closePath();ax.fill();
  }
}
function render(){
  drawWheel();
  drawVessel();
  // process caption
  ax.fillStyle="rgba(224,168,107,.75)";
  ax.font="11px ui-monospace,Menlo,monospace";
  ax.fillText(state==="wet"?"WET · ON THE WHEEL":"FIRED · GLAZE "+glaze.toUpperCase(),16,24);
}
newForm();
var last=0,mt=0;
function loop(now){
  var dt=last?Math.min(50,now-last):16;last=now;
  wheelPhase+=dt*0.004;
  render();
  if(now-mt>300){mt=now;metrics();}
  requestAnimationFrame(loop);
}
metrics();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
