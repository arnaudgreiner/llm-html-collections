<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>020 · Parcel Orbit</title>
<style>
:root{--bg:#05070c;--txt:#e6edf7;--mute:#7c89a3;--line:#1a2130;--hot:#ff4d6d;
  --acc:#4dd0e1;--gold:#ffd166}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{min-height:100vh;color:var(--txt);font-family:"Segoe UI",system-ui,Helvetica,Arial,sans-serif;
  background:var(--bg);overflow-x:hidden}
#space{position:fixed;inset:0;display:block;width:100%;height:100%;z-index:0}
.hud{position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:26px 22px 60px;
  pointer-events:none}
.hud>*{pointer-events:auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.kicker{font-size:10px;letter-spacing:.44em;text-transform:uppercase;color:var(--mute)}
h1{margin:8px 0 0;font-size:clamp(30px,5vw,56px);font-weight:200;letter-spacing:.02em}
h1 b{font-weight:800;color:var(--acc)}
h1 em{font-family:Georgia,serif;font-style:italic;color:var(--gold);font-weight:400}
.readout{text-align:right;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;
  line-height:2;color:var(--mute);font-variant-numeric:tabular-nums}
.readout b{color:var(--acc);font-weight:700}

.dock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:3;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;
  background:rgba(8,11,18,.82);backdrop-filter:blur(9px);border:1px solid var(--line);
  border-radius:14px;padding:11px 13px;max-width:min(94vw,780px)}
button{font-family:inherit;cursor:pointer;transition:.2s}
.gbtn{padding:12px 17px;border:1.5px solid var(--acc);background:rgba(77,208,225,.12);
  color:var(--acc);border-radius:9px;font-size:11px;font-weight:800;letter-spacing:.2em;
  text-transform:uppercase}
.gbtn:hover{background:var(--acc);color:#04161a;transform:translateY(-2px)}
.gbtn.hot{border-color:var(--hot);background:rgba(255,77,109,.12);color:var(--hot)}
.gbtn.hot:hover{background:var(--hot);color:#1a040a}
.gbtn.gold{border-color:var(--gold);color:var(--gold);background:rgba(255,209,102,.1)}
.gbtn.gold:hover{background:var(--gold);color:#1a1304}
.stepper{display:flex;align-items:center;gap:8px;border:1px solid var(--line);
  border-radius:9px;padding:7px 11px;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--mute)}
.stepper b{color:var(--gold);font-size:14px;font-variant-numeric:tabular-nums;min-width:34px;
  text-align:center}
.stepper button{width:26px;height:26px;border:1px solid var(--line);background:#0b0f18;
  color:var(--txt);border-radius:7px;font-size:15px;line-height:1}
.stepper button:hover{border-color:var(--gold);color:var(--gold)}
.toggle{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--mute);cursor:pointer}
.toggle input{accent-color:var(--hot);width:16px;height:16px}

.legend{position:fixed;right:22px;top:120px;z-index:3;display:flex;flex-direction:column;gap:8px;
  background:rgba(8,11,18,.7);border:1px solid var(--line);border-radius:12px;padding:13px 14px;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.legend div{display:flex;align-items:center;gap:9px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.log{position:fixed;left:22px;bottom:96px;z-index:3;width:min(340px,72vw);
  background:rgba(8,11,18,.7);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.log h2{margin:0 0 8px;font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--mute)}
.log ul{list-style:none;margin:0;padding:0;max-height:150px;overflow:hidden}
.log li{font-size:11.5px;line-height:1.75;color:var(--mute);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:slidein .35s ease}
.log li b{color:var(--acc);font-weight:700}
.log li.warn b{color:var(--hot)}
.log li.gold b{color:var(--gold)}
@keyframes slidein{from{opacity:0;transform:translateX(-10px)}}
.foot{position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:0 22px 30px;
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:10px;
  letter-spacing:.3em;text-transform:uppercase;color:var(--mute)}
@media(max-width:820px){.legend{display:none}.log{bottom:150px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="space" aria-label="Orbital delivery simulation"></canvas>

<div class="hud">
  <header>
    <div>
      <span class="kicker">Folio 020 · orbital logistics</span>
      <h1>Parcel <b>Orbit</b> <em>dispatch</em></h1>
    </div>
    <div class="readout">
      Delivered <b id="rDone">0</b> · Lost <b id="rLost">0</b><br>
      Fuel <b id="rFuel">100</b>% · Thrust <b id="rThr">idle</b><br>
      Cargo <b id="rCargo">3</b> · Day <b id="rDay">1</b>
    </div>
  </header>
</div>

<aside class="legend">
  <div><i style="background:#4dd0e1"></i>hub</div>
  <div><i style="background:#ffd166"></i>station</div>
  <div><i style="background:#ff4d6d"></i>debris</div>
  <div><i style="background:#7cf59a"></i>cargo pod</div>
</aside>

<section class="log">
  <h2>Dispatch log</h2>
  <ul id="log"><li>Bay online — three pods stacked, routes open.</li></ul>
</section>

<div class="dock">
  <button class="gbtn" id="bBoost" type="button">▲ Boost</button>
  <button class="gbtn hot" id="bBrake" type="button">▼ Brake</button>
  <button class="gbtn gold" id="bDeliver" type="button">Deliver</button>
  <span class="stepper">Spend <button id="bMinus" type="button" aria-label="less fuel">−</button>
    <b id="spend">12</b> <button id="bPlus" type="button" aria-label="more fuel">+</button> fuel</span>
  <label class="toggle"><input type="checkbox" id="auto"> auto-resupply</label>
</div>

<footer class="foot">
  <span>Hold boost to climb, brake to fall — match the gold stations</span>
  <span>020 / 100</span>
</footer>

<script>
(function(){
  "use strict";
  var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv=document.getElementById("space"), ctx=cv.getContext("2d");
  var W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2);

  var hub, stations=[], debris=[], pods=[], stars=[], sparks=[];
  var fuel=100, cargo=3, done=0, lost=0, day=1, thrust=0, spend=12;
  var keys={};

  var el=function(id){ return document.getElementById(id); };

  function log(msg,cls){
    var ul=el("log");
    var li=document.createElement("li");
    if(cls) li.className=cls;
    li.innerHTML=msg;
    ul.insertBefore(li,ul.firstChild);
    while(ul.children.length>6) ul.removeChild(ul.lastChild);
  }

  function resize(){
    W=window.innerWidth; H=window.innerHeight;
    cv.width=Math.floor(W*dpr); cv.height=Math.floor(H*dpr);
    cv.style.width=W+"px"; cv.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function build(){
    hub={x:W*0.5, y:H*0.62, r:46};
    stations=[];
    for(var i=0;i<6;i++){
      var a=(i/6)*Math.PI*2+0.4;
      var rad=140+ (i%3)*70;
      stations.push({ang:a, rad:rad, spin:(i%2?1:-1)*0.0018*(0.7+i*0.1),
        hue: i%2? 44:190, served:0});
    }
    debris=[];
    for(var d=0;d<9;d++){
      debris.push({ang:Math.random()*Math.PI*2, rad:210+Math.random()*260,
        spin:0.0009+Math.random()*0.0016, r:8+Math.random()*14,
        shape:Math.floor(Math.random()*3)});
    }
    pods=[];
    for(var p=0;p<3;p++) pods.push({armed:true});
    stars=[];
    for(var s=0;s<220;s++){
      stars.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.4+0.2,
        tw:Math.random()*0.03+0.005, ph:Math.random()*6.28, a:Math.random()*0.7+0.15});
    }
  }

  function stationPos(st){
    return {x:hub.x+Math.cos(st.ang)*st.rad, y:hub.y+Math.sin(st.ang)*st.rad*0.72};
  }

  function updateHud(){
    el("rDone").textContent=done; el("rLost").textContent=lost;
    el("rFuel").textContent=Math.max(0,Math.round(fuel));
    el("rCargo").textContent=cargo; el("rDay").textContent=day;
    el("rThr").textContent= thrust>0.05?"burn":(thrust<-0.05?"retro":"idle");
  }

  function boost(dir){
    if(fuel<=0){ log("Fuel dry — <b>auto-resupply</b> or wait for the day cycle.","warn"); return; }
    var cost=spend;
    fuel-=cost;
    thrust=dir;
    /* pods fly out from the hub */
    pods.forEach(function(pd,i){
      if(!pd.armed) return;
      pd.armed=false;
      var a=-Math.PI/2 + (i-1)*0.55;
      pd.x=hub.x+Math.cos(a)*hub.r;
      pd.y=hub.y+Math.sin(a)*hub.r;
      pd.vx=Math.cos(a)*(3.4+dir*0.9);
      pd.vy=Math.sin(a)*(3.4+Math.abs(dir)*1.4)-dir*2.6;
      pd.life=0; pd.dead=false;
    });
    updateHud();
  }

  function deliver(){
    /* nearest station to hub centre within tolerance */
    var best=null, bd=1e9;
    stations.forEach(function(st){
      var p=stationPos(st);
      var d=Math.hypot(p.x-hub.x,p.y-hub.y);
      if(d<bd){ bd=d; best=st; }
    });
    if(cargo<=0){ log("No cargo aboard — cycle the bay first.","warn"); return; }
    if(bd<200 && best){
      cargo--; done++;
      best.served++;
      var p2=stationPos(best);
      burst(p2.x,p2.y,"#ffd166",16);
      log('Pod delivered to relay <b>#'+(stations.indexOf(best)+1)+
          '</b> · total <b>'+done+'</b>');
      if(cargo===0){
        day++; cargo=3;
        fuel=Math.min(100,fuel+(el("auto").checked?45:18));
        pods.forEach(function(pd){ pd.armed=true; });
        log('Day <b>'+day+'</b> — bay re-stacked, fuel '+(el("auto").checked?"+45":"+18")+'.',"gold");
      }
    }else{
      log("No relay in range — climb or fall into one first.","warn");
    }
    updateHud();
  }

  function burst(x,y,color,n){
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2, s=1+Math.random()*3;
      sparks.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c:color});
    }
  }

  function step(){
    /* pods in flight */
    pods.forEach(function(pd){
      if(pd.armed||pd.dead) return;
      pd.life++;
      pd.vy+=0.05;                 /* gravity toward the planet */
      pd.x+=pd.vx; pd.y+=pd.vy;
      /* station intercept */
      for(var i=0;i<stations.length;i++){
        var sp=stationPos(stations[i]);
        if(Math.hypot(sp.x-pd.x, sp.y-pd.y)<26){
          pd.dead=true;
          burst(pd.x,pd.y,"#7cf59a",10);
          log('Pod captured by relay <b>#'+(i+1)+'</b>.','');
          return;
        }
      }
      /* debris strike */
      for(var j=0;j<debris.length;j++){
        var dp=debris[j];
        if(Math.hypot(dp.x-pd.x, dp.y-pd.y)<dp.r+6){
          pd.dead=true; lost++;
          burst(pd.x,pd.y,"#ff4d6d",12);
          log('Pod lost to debris <b>#'+(j+1)+'</b> — total lost '+lost+'.',"warn");
          updateHud();
          return;
        }
      }
      if(pd.x<-40||pd.x>W+40||pd.y<-40||pd.y>H+60){
        pd.dead=true; lost++;
        log("Pod burned up on exit vector — <b>"+lost+"</b> lost.","warn");
        updateHud();
      }
      if(pd.life>900) pd.dead=true;
    });
    /* recycle dead pods back to armed after a beat */
    pods.forEach(function(pd){
      if(pd.dead){ pd.armed=true; pd.dead=false; }
    });

    stations.forEach(function(st){ st.ang+=st.spin; });
    debris.forEach(function(dp){
      dp.ang+=dp.spin;
      dp.x=hub.x+Math.cos(dp.ang)*dp.rad;
      dp.y=hub.y+Math.sin(dp.ang)*dp.rad*0.72;
    });
    for(var i=0;i<sparks.length;i++){
      var s=sparks[i];
      s.x+=s.vx; s.y+=s.vy; s.vy+=0.05; s.life-=0.025;
    }
    sparks=sparks.filter(function(s){ return s.life>0; });

    /* fuel trickle + day cycle */
    fuel-=0.02;
    if(fuel<=0 && el("auto").checked){ fuel=Math.min(100,fuel+45); log("Auto-resupply fired — <b>+45</b> fuel.","gold"); }
    updateHud();
  }

  function draw(t){
    /* deep space */
    var g=ctx.createRadialGradient(W*0.5,H*0.55,0,W*0.5,H*0.55,Math.max(W,H)*0.8);
    g.addColorStop(0,"#0a1018"); g.addColorStop(1,"#05070c");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    stars.forEach(function(s){
      var a=reduce? s.a : s.a*(0.6+0.4*Math.sin(t*s.tw+s.ph));
      ctx.fillStyle="rgba(230,237,247,"+a.toFixed(3)+")";
      ctx.fillRect(s.x,s.y,s.r,s.r);
    });

    /* orbit guides */
    stations.forEach(function(st){
      ctx.strokeStyle="rgba(77,208,225,.10)"; ctx.lineWidth=1;
      ctx.beginPath();
      ctx.ellipse(hub.x,hub.y,st.rad,st.rad*0.72,0,0,Math.PI*2);
      ctx.stroke();
    });

    /* hub */
    var hr=hub.r;
    var hg=ctx.createRadialGradient(hub.x-10,hub.y-12,4,hub.x,hub.y,hr);
    hg.addColorStop(0,"#9ff0ff"); hg.addColorStop(0.5,"#1b7f8f"); hg.addColorStop(1,"#0a2c33");
    ctx.fillStyle=hg;
    ctx.beginPath(); ctx.arc(hub.x,hub.y,hr,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="rgba(77,208,225,.6)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(hub.x,hub.y,hr+9,0,Math.PI*2); ctx.stroke();
    /* cargo pips on the hub */
    for(var c=0;c<3;c++){
      ctx.fillStyle = c<cargo ? "#7cf59a" : "rgba(124,245,154,.18)";
      ctx.beginPath();
      ctx.arc(hub.x-20+c*20, hub.y+hr+26, 5, 0, Math.PI*2);
      ctx.fill();
    }

    /* stations */
    stations.forEach(function(st,i){
      var p=stationPos(st);
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(st.ang*3);
      ctx.strokeStyle= st.served? "rgba(255,209,102,.95)" : "rgba(255,209,102,.55)";
      ctx.lineWidth=2;
      ctx.strokeRect(-14,-14,28,28);
      ctx.strokeRect(-8,-8,16,16);
      ctx.restore();
      ctx.fillStyle="rgba(255,209,102,.9)";
      ctx.font="700 10px 'Segoe UI',system-ui,sans-serif";
      ctx.textAlign="center";
      ctx.fillText("#"+(i+1), p.x, p.y-22);
      if(st.served){
        ctx.fillStyle="rgba(255,209,102,.75)";
        ctx.fillText("✓ "+st.served, p.x, p.y+30);
      }
    });

    /* debris */
    debris.forEach(function(dp){
      ctx.save();
      ctx.translate(dp.x,dp.y);
      ctx.rotate(t*0.0006+dp.rad);
      ctx.fillStyle="rgba(255,77,109,.75)";
      ctx.strokeStyle="rgba(255,77,109,.35)";
      ctx.lineWidth=1.5;
      ctx.beginPath();
      if(dp.shape===0){ ctx.rect(-dp.r*0.7,-dp.r*0.7,dp.r*1.4,dp.r*1.4); }
      else if(dp.shape===1){
        ctx.moveTo(0,-dp.r); ctx.lineTo(dp.r*0.9,dp.r*0.7); ctx.lineTo(-dp.r*0.9,dp.r*0.7);
        ctx.closePath();
      }else{
        ctx.moveTo(-dp.r,0);
        ctx.lineTo(-dp.r*0.3,-dp.r*0.8); ctx.lineTo(dp.r*0.7,-dp.r*0.3);
        ctx.lineTo(dp.r*0.4,dp.r*0.8); ctx.lineTo(-dp.r*0.5,dp.r*0.5);
        ctx.closePath();
      }
      ctx.fill(); ctx.stroke();
      ctx.restore();
    });

    /* pods */
    pods.forEach(function(pd){
      if(pd.armed) return;
      ctx.strokeStyle="rgba(124,245,154,.35)"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(pd.x-pd.vx*5,pd.y-pd.vy*5); ctx.lineTo(pd.x,pd.y); ctx.stroke();
      var pg=ctx.createRadialGradient(pd.x-2,pd.y-2,1,pd.x,pd.y,7);
      pg.addColorStop(0,"#d6ffe0"); pg.addColorStop(1,"#38c56b");
      ctx.fillStyle=pg;
      ctx.beginPath(); ctx.arc(pd.x,pd.y,6,0,Math.PI*2); ctx.fill();
    });

    /* sparks */
    sparks.forEach(function(s){
      ctx.globalAlpha=Math.max(0,s.life);
      ctx.fillStyle=s.c;
      ctx.fillRect(s.x-1.5,s.y-1.5,3,3);
      ctx.globalAlpha=1;
    });

    /* thrust streak over the hub */
    if(Math.abs(thrust)>0.05){
      ctx.strokeStyle= thrust>0? "rgba(77,208,225,.5)":"rgba(255,77,109,.5)";
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(hub.x,hub.y, hub.r+18+Math.abs(thrust)*10, 0, Math.PI*2);
      ctx.stroke();
      thrust*=0.9;
      if(Math.abs(thrust)<0.05) thrust=0;
    }
  }

  function loop(t){
    if(!reduce) step();
    draw(t||0);
    requestAnimationFrame(loop);
  }

  window.addEventListener("keydown",function(e){
    keys[e.key]=true;
    if(e.key===" "||e.key==="ArrowUp"){ boost(1); e.preventDefault(); }
    if(e.key==="ArrowDown"){ boost(-1); e.preventDefault(); }
    if(e.key==="Enter"){ deliver(); }
  });
  window.addEventListener("keyup",function(e){ keys[e.key]=false; });

  el("bBoost").addEventListener("click",function(){ boost(1); });
  el("bBrake").addEventListener("click",function(){ boost(-1); });
  el("bDeliver").addEventListener("click",deliver);
  el("bPlus").addEventListener("click",function(){
    spend=Math.min(30,spend+3); el("spend").textContent=spend; });
  el("bMinus").addEventListener("click",function(){
    spend=Math.max(3,spend-3); el("spend").textContent=spend; });
  el("auto").addEventListener("change",function(){
    log(this.checked?"Auto-resupply <b>armed</b>.":"Auto-resupply <b>off</b>.", this.checked?"gold":"");
  });

  window.addEventListener("resize",function(){ resize(); build(); });
  resize(); build(); updateHud();
  log("Bay online — boost to launch, deliver when a relay is in range.","");
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
