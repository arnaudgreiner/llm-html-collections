<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>026 · Kite Board</title>
<style>
:root{--bg:#f2efe9;--col:#e9e5dc;--line:#d8d2c5;--ink:#22201c;--mute:#87806f;
  --blue:#3457d5;--rose:#d0574b;--sun:#e8a72d;--jade:#2f9e6f;--wht:#fffdf8}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 15% -10%, #fbf9f3, transparent 60%), var(--bg);
  color:var(--ink);font-family:"Segoe UI",system-ui,Helvetica,Arial,sans-serif;
  background-image:linear-gradient(rgba(0,0,0,.025) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(0,0,0,.025) 1px,transparent 1px);
  background-size:26px 26px}
header{max-width:1320px;margin:0 auto;padding:30px 22px 8px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
.kicker{font-size:10px;letter-spacing:.46em;text-transform:uppercase;color:var(--mute)}
h1{margin:9px 0 0;font-size:clamp(27px,4vw,44px);font-weight:300;letter-spacing:.01em}
h1 b{font-weight:800;color:var(--blue)}
.tip{font-size:12.5px;color:var(--mute);max-width:44ch;line-height:1.6}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.legend span{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--mute)}
.legend i{width:10px;height:10px;border-radius:3px}

.board{max-width:1320px;margin:14px auto 0;padding:12px 22px 40px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start}
@media(max-width:1050px){.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.board{grid-template-columns:1fr}}
.col{background:var(--col);border:1px solid var(--line);border-radius:16px;padding:12px;
  min-height:220px;transition:.2s}
.col.over{border-color:var(--blue);background:#e4e7f6;box-shadow:0 0 0 3px rgba(52,87,213,.14)}
.col h2{margin:2px 4px 12px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.col h2 .count{background:var(--wht);border:1px solid var(--line);border-radius:20px;
  padding:2px 9px;font-size:10px;color:var(--ink);font-variant-numeric:tabular-nums}
.list{min-height:60px;display:flex;flex-direction:column;gap:10px}

.task{background:var(--wht);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px 10px;cursor:grab;position:relative;
  box-shadow:0 1px 0 rgba(0,0,0,.05), 0 6px 14px rgba(0,0,0,.05);
  transition:transform .18s, box-shadow .18s, opacity .18s}
.task:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.10)}
.task.grabbing{opacity:.45;cursor:grabbing;transform:rotate(2.2deg) scale(.98)}
.task .bar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:12px 0 0 12px}
.task .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.task h3{margin:0;font-size:14.5px;font-weight:650;letter-spacing:-.01em}
.task p{margin:6px 0 0;font-size:12.5px;line-height:1.55;color:#6b6455}
.meta{margin-top:9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:9px;letter-spacing:.18em;text-transform:uppercase;padding:3px 8px;
  border-radius:20px;border:1px solid currentColor;opacity:.85}
.pri{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.due{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.due.today{color:var(--rose);font-weight:700}
.grabber{position:absolute;right:9px;top:9px;color:#c7bfae;font-size:12px;letter-spacing:-2px;
  opacity:0;transition:.2s}
.task:hover .grabber{opacity:1}
.empty{font-size:11.5px;color:var(--mute);border:1.5px dashed var(--line);border-radius:11px;
  padding:16px 10px;text-align:center;letter-spacing:.1em;text-transform:uppercase}
.ghost{border:1.5px dashed var(--blue);background:rgba(52,87,213,.06);border-radius:12px;
  height:56px}

.addbar{max-width:1320px;margin:0 auto;padding:0 22px 60px;display:flex;gap:10px;flex-wrap:wrap}
.addbar input{flex:1;min-width:230px;background:var(--wht);border:1px solid var(--line);
  border-radius:12px;padding:13px 15px;font:inherit;font-size:14px;outline:none}
.addbar input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(52,87,213,.15)}
.addbar button{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:0 22px;
  font:inherit;font-size:13px;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:.2s}
.addbar button:hover{background:#2745ad;transform:translateY(-1px)}
.foot{max-width:1320px;margin:0 auto;padding:0 22px 34px;display:flex;justify-content:space-between;
  gap:12px;flex-wrap:wrap;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div>
    <span class="kicker">Folio 026 · production board</span>
    <h1><b>Kite</b> Board</h1>
    <div class="legend">
      <span><i style="background:var(--rose)"></i>urgent</span>
      <span><i style="background:var(--sun)"></i>soon</span>
      <span><i style="background:var(--jade)"></i>relaxed</span>
      <span><i style="background:var(--blue)"></i>review</span>
    </div>
  </div>
  <p class="tip">Drag a card between columns with the mouse or the keyboard
    (<b>←/→</b>, then <b>Enter</b> drops it). Order inside a column is yours too.</p>
</header>

<div class="board" id="board"></div>

<form class="addbar" id="newForm">
  <input id="newTask" type="text" placeholder="Add a task and press Enter…" aria-label="new task"
    maxlength="70" autocomplete="off">
  <button type="submit">Add card</button>
</form>

<footer class="foot">
  <span>state kept in this browser tab only</span>
  <span>026 / 100</span>
</footer>

<script>
(function(){
  "use strict";
  var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var COLS=[
    {id:"backlog", name:"Backlog"},
    {id:"build",   name:"Building"},
    {id:"review",  name:"In review"},
    {id:"done",    name:"Shipped"}
  ];
  var TONE={urgent:{c:"var(--rose)",t:"urgent"}, soon:{c:"var(--sun)",t:"soon"},
            relaxed:{c:"var(--jade)",t:"relaxed"}, review:{c:"var(--blue)",t:"review"}};
  var seed=[
    {c:"backlog", h:"Foil-stamped covers", p:"Source an uncoated stock that takes a dry emboss.",
     tone:"soon", due:"Fri", pri:"P2"},
    {c:"backlog", h:"Archive index page",  p:"Grid the 400 back issues by year and colour.",
     tone:"relaxed", due:"next week", pri:"P3"},
    {c:"build",   h:"Wayfinding pictograms", p:"Eighteen glyphs on a 24px lattice, 2px stroke.",
     tone:"urgent", due:"today", pri:"P0"},
    {c:"build",   h:"Risograph colour test", p:"Fluorescent pink over aqua, three densities.",
     tone:"soon", due:"Wed", pri:"P2"},
    {c:"review",  h:"Type specimen film",  p:"60-second loop, last pass on the pacing.",
     tone:"review", due:"Thu", pri:"P1"},
    {c:"done",    h:"Shop window vinyl",   p:"Cut, weeded, applied before the heat arrived.",
     tone:"relaxed", due:"done", pri:"P3"},
    {c:"done",    h:"Season menu cards",   p:"Duplexed boards, letterpressed in two inks.",
     tone:"relaxed", due:"done", pri:"P3"}
  ];
  var uid=0;
  var tasks=seed.map(function(s){
    s.id="t"+(++uid); return s;
  });

  var board=document.getElementById("board");
  var dragged=null, ghost=null;

  COLS.forEach(function(col){
    var sec=document.createElement("section");
    sec.className="col"; sec.dataset.col=col.id;
    sec.innerHTML='<h2>'+col.name+'<span class="count" data-count="'+col.id+'">0</span></h2>'+
                  '<div class="list" data-list="'+col.id+'"></div>';
    board.appendChild(sec);
  });

  function el(tag,cls,html){
    var n=document.createElement(tag);
    if(cls) n.className=cls;
    if(html!==undefined) n.innerHTML=html;
    return n;
  }

  function card(t){
    var tone=TONE[t.tone]||TONE.relaxed;
    var c=el("article","task");
    c.draggable=true;
    c.dataset.id=t.id;
    c.setAttribute("tabindex","0");
    c.setAttribute("role","button");
    c.setAttribute("aria-label",t.h+", "+t.c+", move with arrow keys");
    c.innerHTML=
      '<span class="bar" style="background:'+tone.c+'"></span>'+
      '<span class="grabber">⣿</span>'+
      '<div class="row"><h3></h3><span class="pri">'+t.pri+'</span></div>'+
      '<p></p>'+
      '<div class="meta"><span class="pill" style="color:'+tone.c+'">'+tone.t+'</span>'+
      '<span class="due'+(/today|Wed|Thu|Fri/.test(t.due)&&t.c!=="done"?" today":"")+'">'+t.due+'</span></div>';
    c.querySelector("h3").textContent=t.h;
    c.querySelector("p").textContent=t.p;

    c.addEventListener("dragstart",function(e){
      dragged=c; c.classList.add("grabbing");
      try{ e.dataTransfer.setData("text/plain",t.id);
           e.dataTransfer.effectAllowed="move"; }catch(err){}
    });
    c.addEventListener("dragend",function(){
      c.classList.remove("grabbing"); dragged=null;
      [].slice.call(document.querySelectorAll(".over")).forEach(function(o){o.classList.remove("over");});
      [].slice.call(document.querySelectorAll(".ghost")).forEach(function(g){g.remove();});
    });

    /* keyboard moving: ← → change column, ↑ ↓ reorder, Enter announces */
    c.addEventListener("keydown",function(e){
      var i=COLS.map(function(x){return x.id;}).indexOf(t.c);
      if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
        e.preventDefault();
        var ni=Math.min(COLS.length-1,Math.max(0,i+(e.key==="ArrowRight"?1:-1)));
        if(ni!==i){ move(t.id,COLS[ni].id,null); focus(t.id); }
      }else if(e.key==="ArrowUp"||e.key==="ArrowDown"){
        e.preventDefault();
        var idx=tasks.indexOf(t);
        var target=tasks.filter(function(o){return o.c===t.c;});
        var pos=target.indexOf(t)+(e.key==="ArrowDown"?1:-1);
        if(pos>=0 && pos<target.length){
          var ref=target[pos];
          var ridx=tasks.indexOf(ref);
          tasks.splice(idx,1);
          tasks.splice(e.key==="ArrowDown"? ridx+1 : ridx, 0, t);
          render(); focus(t.id);
        }
      }else if(e.key==="Enter"){
        e.preventDefault();
        e.currentTarget.style.outline="";
        e.currentTarget.setAttribute("aria-grabbed","false");
      }
    });
    c.addEventListener("focus",function(){ c.style.outline="2px solid var(--blue)"; });
    c.addEventListener("blur",function(){ c.style.outline=""; });

    return c;
  }

  function focus(id){
    var n=document.querySelector('[data-id="'+id+'"]');
    if(n) n.focus();
  }

  function move(id,colId,afterId){
    var t=tasks.filter(function(o){return o.id===id;})[0];
    if(!t) return;
    tasks.splice(tasks.indexOf(t),1);
    t.c=colId;
    if(afterId){
      var ai=-1;
      tasks.forEach(function(o,i){ if(o.id===afterId) ai=i; });
      tasks.splice(ai+1,0,t);
    }else{
      var last=-1;
      tasks.forEach(function(o,i){ if(o.c===colId) last=i; });
      tasks.splice(last+1,0,t);
    }
    render();
  }

  function render(){
    COLS.forEach(function(col){
      var list=document.querySelector('[data-list="'+col.id+'"]');
      var mine=tasks.filter(function(t){return t.c===col.id;});
      list.innerHTML="";
      if(!mine.length){
        list.appendChild(el("div","empty","drop here"));
      }else{
        mine.forEach(function(t){ list.appendChild(card(t)); });
      }
      document.querySelector('[data-count="'+col.id+'"]').textContent=mine.length;
    });
  }

  /* HTML5 drop targets on columns and lists */
  board.addEventListener("dragover",function(e){
    e.preventDefault();
    var col=e.target.closest? e.target.closest(".col") : null;
    if(!col) return;
    col.classList.add("over");
    if(!ghost){ ghost=el("div","ghost"); }
    var list=col.querySelector(".list");
    var after=null;
    [].slice.call(list.children).forEach(function(node){
      if(node.classList.contains("task")){
        var r=node.getBoundingClientRect();
        if(e.clientY < r.top + r.height/2 && !after) after=node;
      }
    });
    if(after) list.insertBefore(ghost,after);
    else list.appendChild(ghost);
  });
  board.addEventListener("dragleave",function(e){
    var col=e.target.closest? e.target.closest(".col") : null;
    if(col && (!e.relatedTarget || !col.contains(e.relatedTarget))) col.classList.remove("over");
  });
  board.addEventListener("drop",function(e){
    e.preventDefault();
    var col=e.target.closest? e.target.closest(".col") : null;
    if(!col || !dragged) return;
    var afterNode=ghost && ghost.nextSibling && ghost.nextSibling.dataset ?
      ghost.nextSibling : null;
    move(dragged.dataset.id, col.dataset.col, afterNode? afterNode.dataset.id : null);
    col.classList.remove("over");
  });

  /* add new cards */
  document.getElementById("newForm").addEventListener("submit",function(e){
    e.preventDefault();
    var input=document.getElementById("newTask");
    var v=input.value.trim();
    if(!v) return;
    var tones=["urgent","soon","relaxed","review"];
    tasks.push({
      id:"t"+(++uid), c:"backlog", h:v, p:"Added just now — define the finish line.",
      tone:tones[Math.floor(Math.random()*tones.length)],
      due:"unscheduled", pri:"P"+(1+Math.floor(Math.random()*3))
    });
    input.value="";
    render();
    var newest=tasks[tasks.length-1];
    var node=document.querySelector('[data-id="'+newest.id+'"]');
    if(node && !reduce){
      node.style.transform="scale(.9)";
      node.style.opacity="0";
      requestAnimationFrame(function(){
        node.style.transition="transform .3s, opacity .3s";
        node.style.transform=""; node.style.opacity="1";
      });
    }
  });

  render();
})();
</script>
</body>
</html>
